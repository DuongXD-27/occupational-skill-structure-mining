e (POS) and SaaS solutions. Backed by Ant International — a global leader in digital payments and financial technology — we play a pivotal role in developing innovative, scalable, and user-centric digital solutions that power EPOS products. Our technologies enable thousands of SMEs in Singapore, with ongoing expansion plans across Asia, to digitize and grow their operations through cost-effective and reliable platforms. At EPOS Vietnam , we cultivate a collaborative and dynamic culture driven by innovation and a passion for transforming businesses through technology. Join us to shape the future of digital solutions across Asia and beyond! Key Contributions Design, develop, and maintain end-to-end data pipelines to ingest, process, and store large volumes of structured and unstructured data . Architect and build scalable data infrastructure, including data lakes, data warehouses, pipelines, and metadata repositories. Build and optimize data platforms to support analytics, AI/ML, and Generative AI applications . Build data pipelines for AI/GenAI use cases, including data preparation, document processing, embeddings, and RAG workflows. Ensure data quality, reliability, consistency, and performance across the data platform. Monitor, troubleshoot, and optimize data pipelines and infrastructure for scalability and cost efficiency. Collaborate with AI/ML Engineers, Software Engineers, and other stakeholders to deliver data and AI products.\nMust have: Bachelor's Degree in Computer Science / Information Technology / Software Development or related fields. 6+ years of hands-on experience in Data Engineering. Strong experience in Data Warehouse, Data Lake, and ETL/ELT pipelines . Strong skills in Python and SQL . Good understanding of data modeling, data quality, and performance optimization. Hands-on experience with AI/ML or Generative AI data pipelines, particularly RAG, embeddings, or vector search. Good/Fluent English communication is mandatory. Nice to have: Experience with AWS/GCP/Azure . Experience with AI Agents / LLM applications .","sp":"tune","kp":false,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"Python","id":"SK0256","s":25,"e":31},{"n":"SQL","id":"SK0278","s":33,"e":36},{"n":"Data Warehouse","id":"SK0102","s":38,"e":52},{"n":"Data Lake","id":"SK0084","s":1854,"e":1863},{"n":"Data Pipelines","id":"SK0093","s":897,"e":911},{"n":"Machine Learning","id":"SK0195","s":1180,"e":1182},{"n":"Generative AI","id":"SK0146","s":1188,"e":1201},{"n":"Embeddings","id":"SK0130","s":1311,"e":1321},{"n":"Retrieval-Augmented Generation","id":"SK0273","s":1327,"e":1330},{"n":"Data Quality","id":"SK0094","s":1349,"e":1361},{"n":"ETL","id":"SK0128","s":1869,"e":1872},{"n":"ELT","id":"SK0127","s":1873,"e":1876},{"n":"Data Modeling","id":"SK0091","s":1945,"e":1958},{"n":"Vector Search","id":"SK0318","s":2101,"e":2114},{"n":"Amazon Web Services","id":"SK0018","s":2194,"e":2197},{"n":"Google Cloud Platform","id":"SK0154","s":2198,"e":2201},{"n":"Microsoft Azure","id":"SK0201","s":2202,"e":2207},{"n":"AI Agents","id":"SK0003","s":2226,"e":2235},{"n":"Large Language Models","id":"SK0179","s":2238,"e":2241}],"S":[{"k":"missing","a":"thêm","lv":"xem","n":"Monitoring","id":"SK0216","why":"«Monitor, troubleshoot, and optimize data pipelines and infrastructure».","s":1431,"e":1438},{"k":"missing","a":"thêm","lv":"xem","n":"Data Catalog","id":"SK0080","why":"«build scalable data infrastructure, including ... metadata repositories».","s":1098,"e":1119}]},{"id":"b6ca25f9074fba4b","src":"ITviec","t":"Data Quality Management Specialist - Data Division","url":"https://itviec.com/it-jobs/data-quality-management-specialist-data-division-mb-bank-0217","x":"Data Quality Management Specialist - Data Division\n2026TD450981 - Chuyên viên Quản lý chất lượng dữ liệu - Data Quality Management Specialist - Khối Dữ liệu - Thực hiện phân loại/cập nhật phân loại bảo mật dữ liệu, xây dựng ma trận phân quyền truy cập dữ liệu - Tham gia triển khai, đánh giá và kiểm soát tuân thủ các quy định pháp luật về bảo vệ dữ liệu cá nhân và bảo mật thông tin - Triển khai đo lường, đánh giá chất lượng dữ liệu theo các tiêu chuẩn, thang điểm, hướng dẫn... đã được ban hành. Giám sát và định kỳ báo cáo về tình hình chất lượng dữ liệu. - Phối hợp các đơn vị phân tích nguyên nhân, triển khai các giải pháp chuẩn hóa chất lượng dữ liệu - Tham gia xây dựng các quy trình, quy định, liên quan đến dữ liệu (chất lượng dữ liệu, bảo mật dữ liệu...)\n1. Kiến thức: Tốt nghiệp đại học, ưu tiên chuyên ngành kinh tế, tài chính, ngân hàng 2. Chứng chỉ: Ưu tiên có chứng chỉ quốc tế: CISSP, CISM, CDPSE, ISO 27001 LA/LI, CDMP Practitioner, CISA. 3. Ngoại ngữ: TOEIC 450 trở lên hoặc chứng chỉ tương đương 4. Kinh nghiệm: - Có tối thiểu 1 năm kinh nghiệm trong lĩnh vực ngân hàng - tài chính. Ưu tiên: - Có kinh nghiệm tham gia và triển khai các dự án liên quan đến dữ liệu. - Hiểu biết về các tiêu chuẩn và khung kiểm soát bảo mật dữ liệu: ISO 27001/27701, NIST, GDPR, PCI-DSS, Decree 13/2023/NĐ-CP. - Có kinh nghiệm triển khai hoặc quản lý các công cụ bảo mật dữ liệu: DLP, Data Masking, Encryption, IAM, SIEM, Key Vault, Cloud Security Tools MB Bank yêu cầu ứng viên ứng tuyển cần cung cấp chi tiết các thông tin sau: - Thông tin cá nhân: Họ và tên, Ngày tháng năm sinh, Giới tính - Số điện thoại và Email liên hệ - Trình độ học vấn, Trường đã tốt nghiệp - Kinh nghiệm làm việc - Từ 3 - 5 kỹ năng nổi bật Vì sao Bạn nên đảm bảo đầy đủ thông tin khi ứng tuyển? - Hồ sơ của Bạn sẽ được đánh giá nhanh chóng. - Đối với các hồ sơ đáp ứng đầy đủ thông tin và tiêu chí tuyển dụng phù hợp, MB Bank sẽ chủ động liên hệ phỏng vấn trong thời gian sớm nhất. - Ứng viên vui lòng kiểm tra email và điện thoại thường xuyên để không bỏ lỡ lịch hẹn phỏng vấn. Cập nhật ngay thông tin mới nhất về các Chương trình do MB tổ chức tại Trang tuyển dụng MB Careers Và các Fanpage: • MB Careers • Ai Yêu Miền Bắc hơn MBers? • Ai Yêu Miền Trung hơn MBers? • Ai Yêu Miền Nam hơn MBers","sp":"holdout","kp":false,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"Data Quality","id":"SK0094","s":0,"e":12},{"n":"Data Security","id":"SK0097","s":198,"e":213},{"n":"SIEM","id":"SK0277","s":1418,"e":1422}],"S":[{"k":"missing","a":"thêm","lv":"xem","n":"Data Governance","id":"SK0082","why":"«phân loại bảo mật dữ liệu, xây dựng ma trận phân quyền truy cập dữ liệu», «xây dựng các quy trình, quy định liên quan đến dữ liệu».","s":188,"e":213},{"k":"missing","a":"thêm","lv":"xem","n":"Cybersecurity","id":"SK0074","why":"«quy định ... bảo vệ dữ liệu cá nhân và bảo mật thông tin», chứng chỉ CISSP/CISM.","s":366,"e":383}]},{"id":"cdfcb6aab046beb9","src":"ITviec","t":"[HCM] Bridge System Engineer - AI Solutions (N1)","url":"https://itviec.com/it-jobs/hcm-bridge-system-engineer-ai-solutions-n1-hybrid-technologies-0152","x":"[HCM] Bridge System Engineer - AI Solutions (N1)\nLà đầu mối trao đổi giữa khách hàng Nhật Bản và đội ngũ phát triển. Phân tích yêu cầu nghiệp vụ, tư vấn giải pháp kỹ thuật và xây dựng tài liệu Requirement Definition, Basic Design. Điều phối việc triển khai dự án, đảm bảo yêu cầu của khách hàng được truyền tải đầy đủ và chính xác tới đội ngũ kỹ thuật. Tham gia thiết kế kiến trúc hệ thống và phát triển phần mềm khi cần thiết. Làm việc cùng đội ngũ AI để xây dựng và triển khai các giải pháp ứng dụng Generative AI, LLM, AI Agent hoặc các sản phẩm tích hợp AI theo nhu cầu khách hàng. Phối hợp với đội ngũ phát triển để tích hợp các dịch vụ AI vào hệ thống hiện có, tối ưu hiệu năng và trải nghiệm người dùng. Thực hiện review tài liệu, hỗ trợ kiểm thử và quản lý chất lượng nhằm đảm bảo sản phẩm đáp ứng tiêu chuẩn của thị trường Nhật Bản. Theo dõi tiến độ, quản lý rủi ro và phối hợp với các bên liên quan để đảm bảo dự án được triển khai đúng kế hoạch. Chủ động nghiên cứu và đề xuất các công nghệ AI, Cloud và giải pháp mới nhằm nâng cao năng suất phát triển và giá trị sản phẩm. *** Địa điểm làm việc: Tòa nhà Đồng Nhân, 90 Nguyễn Đình Chiểu, Phường Tân Định, TP.HCM\nBạn cần có: Tốt nghiệp ĐH chuyên ngành CNTT hoặc tương đương. JLPT N1 hoặc tương đương, giao tiếp tốt (Business Level.) Có kinh nghiệm phát triển phần mềm Có kinh nghiệm Requirement Definition và Basic Design . Kinh nghiệm sử dụng các nền tảng AI như OpenAI API, Azure OpenAI, Google Vertex AI, Amazon Bedrock hoặc các mô hình mã nguồn mở. Kinh nghiệm AI-driven Development hoặc sử dụng AI để nâng cao năng suất phát triển phần mềm. Kinh nghiệm kiểm thử, đảm bảo chất lượng phần mềm trong các dự án dành cho khách hàng Nhật. Kinh nghiệm làm việc trực tiếp với khách hàng Nhật và điều phối giữa Business và Development Team. Ưu tiên (Nice to have): Kinh nghiệm phát triển các sản phẩm hoặc giải pháp ứng dụng AI, đặc biệt là Generative AI, LLM, RAG, AI Agent, AI Workflow. Kinh nghiệm phát triển Web Application / Mobile Application, triển khai hệ thống trên AWS, GCP hoặc Azure cho thị trường Nhật Bản. Có thể sử dụng một trong các ngôn ngữ: C++, C#, Rust, Java, Scala, Python, PHP, TypeScript hoặc Go. Kinh nghiệm quản lý dự án / Product Management Ưu tiên từng làm việc tại Nhật. Có thể sử dụng tiếng Anh.","sp":"holdout","kp":true,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"System Architecture","id":"SK0303","s":362,"e":389},{"n":"Generative AI","id":"SK0146","s":502,"e":515},{"n":"Large Language Models","id":"SK0179","s":517,"e":520},{"n":"AI Agents","id":"SK0003","s":522,"e":530},{"n":"Cloud Computing","id":"SK0062","s":1006,"e":1011},{"n":"OpenAI API","id":"SK0231","s":1424,"e":1434},{"n":"Microsoft Azure","id":"SK0201","s":1436,"e":1441},{"n":"Vertex AI","id":"SK0319","s":1450,"e":1466},{"n":"Amazon Bedrock","id":"SK0014","s":1468,"e":1482},{"n":"Retrieval-Augmented Generation","id":"SK0273","s":1917,"e":1920},{"n":"Amazon Web Services","id":"SK0018","s":2031,"e":2034},{"n":"Google Cloud Platform","id":"SK0154","s":2036,"e":2039},{"n":"C++","id":"SK0049","s":2115,"e":2118},{"n":"C#","id":"SK0048","s":2120,"e":2122},{"n":"Java","id":"SK0168","s":2130,"e":2134},{"n":"Scala","id":"SK0280","s":2136,"e":2141},{"n":"Python","id":"SK0256","s":2143,"e":2149},{"n":"TypeScript","id":"SK0314","s":2156,"e":2166},{"n":"Go","id":"SK0151","s":1450,"e":1452}],"S":[{"k":"label","a":"sửa bằng chứng","lv":"cao","n":"Go","id":"SK0151","why":"Bằng chứng đang trỏ vào «Go» trong «Google Vertex AI»; bằng chứng đúng là «Go» trong «TypeScript hoặc Go».","s":2172,"e":2174,"li":18}]},{"id":"ff6a415fdeadc7ed","src":"ITviec","t":"Senior AI/ML Engineer (OCR, English)","url":"https://itviec.com/it-jobs/senior-ai-ml-engineer-ocr-english-topicus-vietnam-5544","x":"Senior AI/ML Engineer (OCR, English)\nAbout Us At Topicus, we believe IT should serve society. From healthcare and education to finance, our solutions empower millions of people daily by turning complex challenges into user-friendly platforms. We don’t just build software; we increase self-reliance and reduce vulnerability for citizens worldwide. With a team of over 1,800+ \"Topicans\" across Southeast Asia (Vietnam & Thailand) and Europe (the Netherlands, Romania, Portugal, and Iceland), we are constantly expanding our horizons. Our ambition reaches far beyond Europe, driven by a shared mission to make a meaningful difference. About the Role We are seeking a Senior AI/ML Engineer to build a next-generation AI-powered OCR platform for the financial industry. This solution processes large volumes of financial documents using modern machine learning and computer vision techniques to automate document recognition, extraction and validation. The product is part of Akkuro, one of the leading composable banking platforms. Our Vietnam team will independently own and further develop this product, giving you significant technical ownership and the opportunity to influence its future direction. Key Responsibilities Design, develop, and optimize AI-powered OCR solutions in Python. Build and improve machine learning models for document recognition and data extraction. Process and analyze large datasets using Pandas and related data processing libraries. Train, evaluate, and deploy machine learning models using TensorFlow or similar frameworks. Collaborate closely with Product Owners, testers, and software engineers. Improve model accuracy, performance, and scalability. Investigate new AI technologies and propose improvements to the product. Take ownership of technical decisions and mentor other engineers.\n5+ years of experience developing Python applications. Strong experience with machine learning and AI. Experience with TensorFlow (or similar frameworks such as PyTorch). Excellent knowledge of Pandas and data processing. Experience working with OCR, computer vision, or document processing is a strong advantage. Familiarity with REST APIs and cloud-based deployments. Strong analytical and problem-solving skills. Excellent English communication skills (communication with international stakeholders).","sp":"tune","kp":false,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"Machine Learning","id":"SK0195","s":840,"e":856},{"n":"Optical Character Recognition","id":"SK0234","s":23,"e":26},{"n":"Computer Vision","id":"SK0066","s":861,"e":876},{"n":"Python","id":"SK0256","s":1280,"e":1286},{"n":"Pandas","id":"SK0238","s":1417,"e":1423},{"n":"TensorFlow","id":"SK0305","s":1521,"e":1531},{"n":"PyTorch","id":"SK0254","s":1983,"e":1990},{"n":"Model Evaluation","id":"SK0208","s":1470,"e":1478},{"n":"Model Deployment","id":"SK0206","s":1484,"e":1514},{"n":"Cloud Computing","id":"SK0062","s":2167,"e":2190}],"S":[{"k":"missing","a":"thêm","lv":"xem","n":"API Design","id":"SK0004","why":"«Familiarity with REST APIs and cloud-based deployments».","s":2153,"e":2162,"auto":"add","autoWhy":"Quy ước 05/11 (Cường): tin nhắc tới xây dựng, tích hợp hoặc làm việc với API (REST, RESTful, SOAP, GraphQL…) thì gán API Design."}]},{"id":"bec90b607986b604","src":"ITviec","t":"CVCC Quản trị dữ liệu (Data Governance, SQL, R )-K.CNTT","url":"https://itviec.com/it-jobs/cvcc-quan-tri-du-lieu-data-governance-sql-r-k-cntt-pvcombank-3539","x":"CVCC Quản trị dữ liệu (Data Governance, SQL, R )-K.CNTT\nTham gia phân tích nghiệp vụ, phối hợp với các đơn vị để lựa chọn các yếu tố dữ liệu quan trọng (CDEs) trong hoạt động kinh doanh và trong các dự án trọng điểm Thực hiện các hoạt động quản trị dữ liệu cho các CDEs các bao gồm xác định nguồn gốc dữ liệu, xác định luồng dữ liệu, lập hồ sơ dữ liệu, thiết lập các quy tắc kiểm soát đảm bảo chất lượng dữ liệu và đảm bảo an toàn dữ liệu Tham gia các chương trình kiểm tra, đánh giá chất lượng dữ liệu, đề xuất các chốt kiểm soát làm sạch và làm giàu dữ liệu trong toàn bộ hệ thống Thực hiện tiếp nhận, chuyển giao công nghệ của các ứng dụng và giải pháp liên quan đến hệ thống Quản trị dữ liệu Tham gia thiết kế và triển khai kho dữ liệu chủ, dữ liệu tham chiếu, từ điển dữ liệu và siêu dữ liệu Phối hợp với các đơn vị liên quan tham gia đánh giá, xây đựng quy định liên quan đến Quản trị và và khai thác Nền tảng phân tích dữ liệu toàn hàng Xây dựng các quy định liên quan đến cung cấp dịch vụ trên các hệ thống Quản trị dữ liệu Tiếp nhận và xử lý các yêu cầu hỗ trợ (level 2) khi hệ thống đưa vào khai thác vận hành thực tế. Phối hợp đánh giá hệ thống định kỳ để đưa ra các đề xuất cải tiến sản phẩm, dịch vụ theo khung quản lý chất lượng tại PVcomBank Tham gia phát triển các dự án chuyển đổi số Tham gia nghiên cứu, tư vấn và đề xuất áp dụng công nghệ mới nâng cao chất lượng, tối ưu nguồn lực phát triển Tham gia các khóa đào tạo chuyên ngành theo khung năng lực của PVcomBank theo từng thời kỳ\nYÊU CẦU CÔNG VIỆC Thành thạo ngôn ngữ R/Python hoặc ngôn ngữ lập trình tương đương Thành thạo ngôn ngữ truy xuất dữ liệu SQL/PLSQL, có kiến thức về các hệ quản trị cơ sở dữ liệu Oracle/MySQL/PostgreSQL/noSQL,... Có kinh nghiệm triển khai ít nhất một dự án về nền tảng Quản trị dữ liệu Có kinh nghiệm tổ chức, xây dựng và quản lý danh mục dữ liệu chủ, dữ liệu tham chiếu, từ điển dữ liệu và siêu dữ liệu Có tối thiểu 3 năm kinh nghiệm làm việc trong lĩnh vực tài chính ngân hàng hoặc triển khai trong lĩnh vực tài chính ngân hàng Ưu tiên các ứng viên Ham học hỏi tìm tòi sáng tạo cái mới Có hiểu biết về nghiệp vụ tài chính ngân hàng Có kinh nghiệm làm việc theo mô hình Agile/Scrum Có kinh nghiệm triển khai nền tảng quản trị dữ liệu IBM Watson Knowledge Catalog Có kinh nghiệm triển khai kho dữ liệu chủ, dữ liệu tham chiếu","sp":"tune","kp":true,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"Data Governance","id":"SK0082","s":23,"e":38},{"n":"SQL","id":"SK0278","s":40,"e":43},{"n":"R","id":"SK0258","s":45,"e":46},{"n":"Python","id":"SK0256","s":1542,"e":1548},{"n":"Data Quality","id":"SK0094","s":393,"e":411},{"n":"Data Security","id":"SK0097","s":423,"e":438},{"n":"Databases","id":"SK0107","s":1666,"e":1679},{"n":"Oracle Database","id":"SK0236","s":1680,"e":1686},{"n":"MySQL","id":"SK0218","s":1687,"e":1692},{"n":"PostgreSQL","id":"SK0243","s":1693,"e":1703}],"S":[{"k":"missing","a":"thêm","lv":"cao","n":"Data Catalog","id":"SK0080","why":"«từ điển dữ liệu và siêu dữ liệu», «IBM Watson Knowledge Catalog».","s":765,"e":796},{"k":"missing","a":"thêm","lv":"xem","n":"Data Management","id":"SK0087","why":"«thiết kế và triển khai kho dữ liệu chủ, dữ liệu tham chiếu» (master/reference data management).","s":728,"e":743}]},{"id":"d9a13c0443c2101b","src":"ITviec","t":"Senior Software Engineer (AI)","url":"https://itviec.com/it-jobs/senior-software-engineer-ai-nab-innovation-centre-vietnam-3731","x":"Senior Software Engineer (AI)\nABOUT THE JOB The Senior Software Engineer (AI) drives the delivery of AI-enabled solutions, automation, and engineering capabilities that improve developer experience, productivity, and software delivery outcomes across NAB. Working closely with architects, engineers, and stakeholders across Australia and Vietnam, you'll design, build, and enhance scalable solutions, while championing engineering quality, security, compliance, and continuous improvement through modern software engineering practices.\nYOUR SKILL AND EXPERIENCES Essential Capabilities Strong software engineering experience with hands-on application development and modern development practices. Experience working with Git, code repositories, CI/CD pipelines, automated testing, and deployment processes. Strong analytical and problem-solving skills with the ability to troubleshoot complex technical issues. Experience building or supporting AI-enabled solutions, automation, intelligent workflows, or developer productivity tooling. Strong focus on engineering quality, coding standards, security, compliance, and continuous improvement. Excellent communication and stakeholder management skills, with the ability to translate technical concepts for both technical and non-technical audiences. Collaborative mindset with experience working across cross-functional and globally distributed teams. Understanding of software delivery best practices, DevOps, Agile methodologies, and enterprise technology environments. Experience Proven experience in Software Engineering, Application Development, Platform Engineering, or related technology roles. Hands-on experience across the Software Development Lifecycle (SDLC), including design, development, testing, deployment, and support. Experience working with enterprise-scale platforms, cloud technologies, and engineering tooling. Experience implementing automation solutions, AI-powered capabilities, or developer experience improvements. Experience contributing to engineering standards, governance, best practices, and continuous improvement initiatives. Exposure to technology risk, controls, compliance, or secure delivery practices in complex environments. Ability to collaborate with engineers, architects, and business stakeholders to deliver scalable and high-quality technology solutions.","sp":"holdout","kp":false,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"Git","id":"SK0149","s":721,"e":724},{"n":"CI/CD","id":"SK0050","s":745,"e":750},{"n":"DevOps","id":"SK0118","s":1451,"e":1457},{"n":"Cloud Computing","id":"SK0062","s":1837,"e":1855},{"n":"Developer Tooling","id":"SK0119","s":1005,"e":1035},{"n":"Automation Engineering","id":"SK0032","s":1906,"e":1926}],"S":[]},{"id":"857ea3e3dfd4cf53","src":"ITviec","t":"AI-Native Fullstack Developer / Vibe Coding Developer","url":"https://itviec.com/it-jobs/ai-native-fullstack-developer-vibe-coding-developer-mediax-5035","x":"AI-Native Fullstack Developer / Vibe Coding Developer\nPhát triển các sản phẩm Web/SaaS/AI Application cho doanh nghiệp. Sử dụng các AI Coding Agent/AI IDE như Claude Code, Codex, Cursor, GitHub Copilot... trong công việc phát triển phần mềm hàng ngày. Dùng AI để: phân tích requirement; nghiên cứu solution; thiết kế architecture; generate và refactor code; debug; viết test; review code; tạo documentation. Phát triển feature end-to-end từ frontend, backend, API, database đến deployment. Biết chia bài toán thành task/context/prompt phù hợp để AI có thể thực hiện hiệu quả. Review, kiểm chứng và chỉnh sửa code do AI sinh ra trước khi đưa lên production. Tích hợp LLM, RAG, AI Agent, Automation vào các sản phẩm thực tế. Tích hợp API, webhook và các nền tảng bên thứ ba. Chủ động prototype nhanh các ý tưởng mới bằng AI và chuyển prototype thành sản phẩm có thể vận hành thực tế. Phối hợp với PM/BA/QA để chuyển yêu cầu nghiệp vụ thành feature hoàn chỉnh.\nCó từ 2 năm kinh nghiệm phát triển phần mềm . Có nền tảng tốt về Python và JavaScript/TypeScript . Có kinh nghiệm với: FastAPI; React/Next.js; REST API; Database; Git; Docker. Đã sử dụng ít nhất một công cụ AI Coding trong công việc thực tế. Có khả năng sử dụng AI để xây dựng hoặc hoàn thiện một feature thay vì chỉ hỏi các đoạn code nhỏ. Hiểu code do AI sinh ra và có khả năng debug khi kết quả không đúng. Có tư duy về architecture, data flow, API và database. Có khả năng đọc log, tìm root cause và xử lý vấn đề độc lập. Có tinh thần ownership , chủ động tìm giải pháp thay vì chờ task chi tiết. Điểm cộng Có kinh nghiệm với Claude Code, Codex, Cursor hoặc các Coding Agent tương tự . Có kinh nghiệm xây dựng workflow phát triển phần mềm bằng AI Agent. Có kinh nghiệm với LLM API, RAG, AI Agent, LangChain/LangGraph, Vector Database, n8n . Đã xây dựng sản phẩm AI chạy production. Có kinh nghiệm chatbot, CRM, workflow automation hoặc document processing. Có GitHub/Portfolio hoặc sản phẩm có thể demo. Có thể mô tả rõ cách bản thân sử dụng AI để hoàn thành một feature thực tế. Quy trình tuyển dụng 1. Thực hiện bài test Ứng viên làm bài test trực tiếp tại văn phòng . Bài test được thực hiện trên PC cài Ubuntu , sử dụng Codex CLI trong quá trình làm bài. Kết quả được đánh giá dựa trên toàn bộ quá trình thực hiện bài test 2. Phỏng vấn Ứng viên pass vòng 1 sẽ tham gia phỏng vấn vòng 2 trực tiếp với anh Thanh Trần - 5 phút AI","sp":"holdout","kp":false,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"AI Agents","id":"SK0003","s":676,"e":684},{"n":"Claude Code","id":"SK0060","s":159,"e":170},{"n":"Codex","id":"SK0064","s":172,"e":177},{"n":"Debugging","id":"SK0110","s":358,"e":363},{"n":"Large Language Models","id":"SK0179","s":666,"e":669},{"n":"Retrieval-Augmented Generation","id":"SK0273","s":671,"e":674},{"n":"Python","id":"SK0256","s":1023,"e":1029},{"n":"TypeScript","id":"SK0314","s":1044,"e":1054},{"n":"FastAPI","id":"SK0136","s":1077,"e":1084},{"n":"Databases","id":"SK0107","s":1111,"e":1119},{"n":"Git","id":"SK0149","s":187,"e":190},{"n":"Docker","id":"SK0125","s":1126,"e":1132},{"n":"LangChain","id":"SK0177","s":1758,"e":1767},{"n":"LangGraph","id":"SK0178","s":1768,"e":1777},{"n":"Vector Database","id":"SK0317","s":1779,"e":1794},{"n":"CRM","id":"SK0051","s":1867,"e":1870},{"n":"Automation Engineering","id":"SK0032","s":1872,"e":1891}],"S":[{"k":"label","a":"sửa bằng chứng","lv":"cao","n":"Git","id":"SK0149","why":"Bằng chứng trỏ vào «Git» trong «GitHub Copilot»; bằng chứng đúng là «Git» trong «REST API; Database; Git; Docker».","s":1121,"e":1124,"li":10},{"k":"missing","a":"thêm","lv":"cao","n":"API Design","id":"SK0004","why":"«Có kinh nghiệm với: FastAPI; React/Next.js; REST API», «Tích hợp API, webhook».","s":1101,"e":1109,"auto":"add","autoWhy":"Quy ước 05/11 (Cường): tin nhắc tới xây dựng, tích hợp hoặc làm việc với API (REST, RESTful, SOAP, GraphQL…) thì gán API Design."},{"k":"missing","a":"thêm","lv":"xem","n":"Prompt Engineering","id":"SK0250","why":"«Biết chia bài toán thành task/context/prompt phù hợp để AI có thể thực hiện hiệu quả».","s":515,"e":534}]},{"id":"baab3fd5baf257b9","src":"ITviec","t":"AI Engineer (Middle/Senior)","url":"https://itviec.com/it-jobs/ai-engineer-middle-senior-saigon-technology-2820","x":"AI Engineer (Middle/Senior)\nJoin in developing and applying the ML/DL techniques to resolve our client’s business problems such as building Chatbot/Agentic/advanced RAG systems, LLM/Prompt, OCR systems, fraud detection systems, facial recognition systems... Join in developing some internal products applying AI models\nMUST HAVE SKILLS: Have programming skills in one of these languages: Python... At least 3 years of experience working with AI/ML projects as a Data Engineer, Research Engineer, or Software Engineer. Have experience with one of ML/DL Frameworks: Tensorflow, Pytorch, scikit-learn, Pandas, Langchain, Langraph, LlamaIndex... Have experience working with OpenAI, Claude, Gemini, any LLM... to build Agentic Solution, Workflows, or advanced RAG systems, using MCP, Tool call, handling Agent Memory/Context. Have experience with one of chatbot building frameworks or services, Agentic System. Familiar with OCR algorithms or services: OpenCV, Tesseract, Textract (AWS), Google Cloud Vision, PaddleOCR. Experience with common development tools: Linux, GPU server, Google Colab, Jupyter, Git, Docker, vLLM, Ollama. Understanding of LLM security risks and mitigation techniques: prompt injection, jailbreaking, data/PII leakage, and adversarial inputs. Experience implementing guardrails for LLM/agentic systems (e.g., input/output validation, content moderation, PII redaction, rate limiting, tool-call permission scoping) using frameworks/services such as Guardrails AI, NeMo Guardrails, Llama Guard, Presidio, or custom rule-based/classifier approaches. Good English proficiency and communication skills. NICE TO HAVE Experience with backend web development (Flask, Django, FastAPI) Experience with SQL database (PostgresSQL, MySQL), NoSQL database (MongoDB), Vector database (Qdrant, Chroma, OpenSearch, PgVector...) Experience with building APIs and services using REST, SOAP, SSE, Websocket etc. Experience in MLOps system: MLflow, DVC, Feature Store, Airflow, CI/CD... Experience in Generative AI, Large Language Model, Prompt/Context Engineer, Diffusion model, HuggingFace, Ollama, LlamaCPP Familiarity with responsible AI practices: bias/fairness evaluation, red-teaming LLM applications, and audit logging for compliance. Knowledge of secure API design and authentication/authorization patterns (OAuth2, API key scoping, least-privilege access) for AI service endpoints.","sp":"holdout","kp":false,"note":"Computer Vision ánh xạ từ facial recognition, Prompt Engineering từ Prompt/Context Engineer; cần hội ý ranh giới cha-con và tên kỹ năng.","L":[{"n":"Machine Learning","id":"SK0195","s":64,"e":66},{"n":"Deep Learning","id":"SK0113","s":67,"e":69},{"n":"Retrieval-Augmented Generation","id":"SK0273","s":165,"e":168},{"n":"Large Language Models","id":"SK0179","s":178,"e":181},{"n":"Optical Character Recognition","id":"SK0234","s":190,"e":193},{"n":"Fraud Detection","id":"SK0143","s":203,"e":218},{"n":"Python","id":"SK0256","s":388,"e":394},{"n":"TensorFlow","id":"SK0305","s":564,"e":574},{"n":"PyTorch","id":"SK0254","s":576,"e":583},{"n":"scikit-learn","id":"SK0327","s":585, ủa LangGraph.","s":618,"e":626},{"k":"missing","a":"thêm","lv":"cao","n":"Jupyter Notebook","id":"SK0170","why":"«Linux, GPU server, Google Colab, Jupyter, Git, Docker».","s":1091,"e":1098},{"k":"missing","a":"thêm","lv":"xem","n":"Agentic AI","id":"SK0010","why":"«build Agentic Solution, Workflows», «Agentic System».","s":715,"e":731},{"k":"missing","a":"thêm","lv":"xem","n":"Linux/Unix Shell","id":"SK0183","why":"«common development tools: Linux, GPU server...».","s":1058,"e":1063},{"k":"missing","a":"thêm","lv":"xem","n":"Data Security","id":"SK0097","why":"«LLM security risks ... data/PII leakage», «PII redaction».","s":1222,"e":1238}]},{"id":"79dcad6b02902e17","src":"ITviec","t":"AI Engineer","url":"https://itviec.com/it-jobs/ai-engineer-bosch-global-software-technologies-company-limited-4106","x":"AI Engineer\nThe EPM department focuses on software tooling development to support embedded products across the XC domains, including Advanced Driver Assistance Systems (ADAS), Car Multimedia (XC-CM), and Cross-Domain Computing & Software-Defined Vehicle platforms (XC-CE/SDV) . We develop tools and engineering solutions that streamline software and system development for technologies such as radar, video, HMI, ultrasonic sensors, vehicle compute platforms, middleware, software integration, CI/CD, and cloud-connected SDV ecosystems. Serving global teams across Japan, China, Europe, and Vietnam, we contribute to the advancement of secure, safe, intelligent, and software-defined mobility solutions by enabling efficient development, integration, validation, and deployment of next-generation automotive software. As an AI Engineer, your typical work activities include: Building and deploying AI-powered applications, working alongside experienced fullstack AI engineers. Applying AI and machine learning to solve real-world problems. Assist in the design, development, and testing of AI models and algorithms. Help build and maintain data pipelines for preprocessing, cleaning, and transforming data for AI applications. Integrate and deploy machine learning models into production systems using APIs and microservices. Participate in code reviews and contribute to the team's software development lifecycle. Collaborate with senior engineers to troubleshoot and optimize AI systems for performance and scalability. Stay up-to-date with the latest advancements in AI, machine learning, and relevant frameworks.\nThe job might be fit for you if you have: Bachelor's degree in Computer Science, AI, or a related technical field. Strong proficiency in Python is a must. Familiarity with other languages like Java or C++ is a plus. Solid understanding of machine learning and deep learning concepts, including supervised and unsupervised learning. Hands-on experience with at least one major AI/ML framework, such as TensorFlow, PyTorch, or Scikit-learn. Knowledge of SQL and experience with data manipulation libraries like Pandas and NumPy. Excellent problem-solving and analytical skills. Strong communication and teamwork abilities. A keen interest in continuous learning and adapting to new technologies. Good English communication skills, be able to interact fluently with worldwide stakeholders.","sp":"holdout","kp":false,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"Machine Learning","id":"SK0195","s":993,"e":1009},{"n":"Data Pipelines","id":"SK0093","s":1140,"e":1154},{"n":"Model Deployment","id":"SK0206","s":1241,"e":1271},{"n":"Microservices","id":"SK0200","s":1311,"e":1324},{"n":"Python","id":"SK0256","s":1754,"e":1760},{"n":"Java","id":"SK0168","s":1810,"e":1814},{"n":"C++","id":"SK0049","s":1818,"e":1821},{"n":"Deep Learning","id":"SK0113","s":1877,"e":1890},{"n":"Supervised Learning","id":"SK0301","s":1911,"e":1921},{"n":"TensorFlow","id":"SK0305","s":2018,"e":2028},{"n":"PyTorch","id":"SK0254","s":2030,"e":2037},{"n":"scikit-learn","id":"SK0327","s":2042,"e":2054},{"n":"SQL","id":"SK0278","s":2069,"e":2072},{"n":"Pandas","id":"SK0238","s":2126,"e":2132},{"n":"NumPy","id":"SK0226","s":2137,"e":2142}],"S":[{"k":"missing","a":"thêm","lv":"xem","n":"API Design","id":"SK0004","why":"«deploy machine learning models into production systems using APIs and microservices».","s":1302,"e":1324,"auto":"add","autoWhy":"Quy ước 05/11 (Cường): tin nhắc tới xây dựng, tích hợp hoặc làm việc với API (REST, RESTful, SOAP, GraphQL…) thì gán API Design."}]},{"id":"1b3e221e00e87258","src":"ITviec","t":"Data Governance Manager (Consumer Finance) - Upto $4000","url":"https://itviec.com/it-jobs/data-governance-manager-consumer-finance-upto-4000-lotte-finance-vietnam-1711","x":"Data Governance Manager (Consumer Finance) - Upto $4000\n1. Governance Framework & Policy • Design, implement, and maintain the enterprise-wide Data Governance Framework, aligning with corporate strategy and regulatory requirements. • Define and enforce data policies, standards, and procedures for data quality, data lifecycle management, metadata management, and data access. • Establish a data ownership and stewardship model, ensuring accountability for data assets across business units. 2. Data Quality & Compliance • Develop and monitor data quality metrics and KPIs, identify data quality issues, and coordinate remediation actions. • Ensure compliance with data-related regulations (e.g., GDPR, local data privacy laws, SBV/State Bank of Vietnam requirements for financial institutions). • Partner with IT, Risk, and Compliance teams to manage data security, privacy, and classification standards. 3. Data Stewardship & Collaboration • Lead and coordinate data steward and data owner communities across the organization. • Provide training, awareness, and communication programs to promote a strong data culture. • Collaborate with business and technology teams to ensure alignment between data governance, architecture, and data analytics initiatives. 4. Metadata & Master Data Management • Support implementation and adoption of metadata management tools, data catalogues, and master data management (MDM) systems. • Ensure consistent business glossary definitions and alignment across data domains. 5. Reporting & Continuous Improvement • Regularly report data governance KPIs and progress to senior management and data governance committees. • Continuously assess and improve data governance maturity, practices, and tools.\nBachelor’s degree or higher in Information Management, Computer Science, Business, or related field. 5+ years of experience in data management, governance, or data quality roles; at least 2–3 years in a managerial or leadership capacity. Proven experience implementing enterprise data governance frameworks and tools (e.g., Collibra, Informatica Axon, Alation, IBM IGC). Familiarity with data management best practices (DAMA-DMBOK) and regulatory requirements for data handling. Strong knowledge of data architecture, metadata, master data, and data quality management concepts. Excellent stakeholder management, communication, and facilitation skills. Good command of English is an advantage","sp":"tune","kp":true,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"Data Governance","id":"SK0082","s":0,"e":15},{"n":"Data Quality","id":"SK0094","s":298,"e":310},{"n":"Data Management","id":"SK0087","s":343,"e":358},{"n":"Data Security","id":"SK0097","s":852,"e":865},{"n":"Data Architecture","id":"SK0079","s":2235,"e":2252},{"n":"Data Catalog","id":"SK0080","s":1366,"e":1381}],"S":[]},{"id":"10911bae157e538f","src":"ITviec","t":"Jr/Mid AI Software Engineer (Python/ AI Integration)","url":"https://itviec.com/it-jobs/jr-mid-ai-software-engineer-python-ai-integration-protonx-3903","x":"Jr/Mid AI Software Engineer (Python/ AI Integration)\nChúng tôi đang tìm kiếm Kỹ sư Phần mềm để tích hợp các công nghệ AI chúng tôi phát triển vào sản phẩm và hệ thống hiện có của khách hàng. Bạn sẽ làm việc cùng đội ngũ kỹ sư đào tạo mô hình (kỹ sư học máy) và khách hàng để xây dựng, tích hợp, triển khai và vận hành các giải pháp AI thực tế. Công việc Phát triển và tích hợp các tính năng sử dụng AI/mô hình AI vào sản phẩm và hệ thống của khách hàng. Xây dựng backend service và API bằng Python . Đấu nối các APIs trên giải pháp AI của công ty vào hạ tầng của khách hàng Phối hợp với đội ngũ đào tạo mô hình để hiểu cách hoạt động của các mô hình AI Làm việc cùng Chuyên viên Phân tích Nghiệp vụ (BA) và khách hàng để tìm hiểu nghiệp vụ. Xử lý dữ liệu, prompt, input/output của model, structured output và các tình huống lỗi. Hỗ trợ triển khai, monitoring, troubleshooting và tối ưu các hệ thống tích hợp AI.\nBạn là ứng viên phù hợp nếu: Có từ 1 năm kinh nghiệm trong Software Engineering, Backend Development hoặc vị trí tương đương. Có kinh nghiệm tốt với Python . Có tư duy thuật toán/giải quyết vấn đề tốt. Có kinh nghiệm làm việc và tích hợp RESTful API và các dịch vụ bên thứ ba. Có kinh nghiệm xây dựng backend service với FastAPI, Flask hoặc framework tương đương. Có hiểu biết tốt về quy trình phát triển phần mềm, backend và tích hợp hệ thống. Có kiến thức cơ bản đến khá về Generative AI, LLM và AI API . Có khả năng giải quyết vấn đề, tự học và giao tiếp tốt. Am hiểu về đầu vào và đầu ra của các mô hình Ai hiện đại như LLM, VLM, Speech-to-text, Text-to-speech. Bạ n sẽ có lợi thế nếu: Có kinh nghiệm tích hợp OpenAI, Qwen, Llama, DeepSeek hoặc các LLM/AI model khác vào ứng dụng hoặc hệ thống production. Có kinh nghiệm xây dựng AI Agent / Agentic Workflow với LangGraph, LangChain, LlamaIndex, CrewAI hoặc framework tương đương. Có kinh nghiệm với AgentOps / AI Observability, như Prometheus, Grafana, OpenTelemetry, Langfuse hoặc các công cụ tương đương. Có kinh nghiệm với RAG, Embedding, Vector Database, Tool Calling hoặc Prompt Engineering. Có kiến thức về model quantization và tối ưu inference, như INT8/INT4, AWQ, GPTQ, batching, KV Cache hoặc tối ưu GPU/VRAM. Có kinh nghiệm với vLLM, Ollama, Triton, TensorRT-LLM hoặc các công nghệ model serving tương đương. Có kinh nghiệm với Docker, CI/CD, Linux hoặc cloud platforms. Có kinh nghiệm với database như PostgreSQL, MySQL, MongoDB hoặc Redis. Có kinh nghiệm làm việc trực tiếp với khách hàng hoặc trong các dự án outsourcing/tích hợp hệ thống.","sp":"tune","kp":false,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"Python","id":"SK0256","s":29,"e":35},{"n":"Monitoring","id":"SK0216","s":848,"e":858},{"n":"FastAPI","id":"SK0136","s":1233,"e":1240},{"n":"Flask","id":"SK0141","s":1242,"e":1247},{"n":"Generative AI","id":"SK0146","s":1388,"e":1401},{"n":"Large Language Models","id":"SK0179","s":1403,"e":1406},{"n":"OpenAI API","id":"SK0231","s":1626,"e":1632},{"n":"Llama","id":"SK0184","s":1640,"e":1645},{"n":"DeepSeek","id":"SK0114","s":1647,"e":1655},{"n":"AI Agents","id":"SK0003","s":1746,"e":1754},{"n":"LangGraph","id":"SK0178","s":1778,"e":1787},{"n":"LangChain","id":"SK0177","s":1789,"e":1798},{"n":"CrewAI","id":"SK0070","s":1812,"e":1818},{"n":"Observability","id":"SK0230","s":1880,"e":1893},{"n":"Prometheus","id":"SK0248","s":1899,"e":1909},{"n":"Grafana","id":"SK0159","s":1911,"e":1918},{"n":"Retrieval-Augmented Generation","id":"SK0273","s":1993,"e":1996},{"n":"Embeddings","id":"SK0130","s":1998,"e":2007},{"n":"Vector Database","id":"SK0317","s":2009,"e":2024},{"n":"Tool Calling","id":"SK0311","s":2026,"e":2038},{"n":"Prompt Engineering","id":"SK0250","s":2044,"e":2062},{"n":"Model Serving","id":"SK0212","s":2260,"e":2273},{"n":"Docker","id":"SK0125","s":2306,"e":2312},{"n":"CI/CD","id":"SK0050","s":2314,"e":2319},{"n":"Cloud Computing","id":"SK0062","s":2332,"e":2347},{"n":"Databases","id":"SK0107","s":2368,"e":2376},{"n":"PostgreSQL","id":"SK0243","s":2381,"e":2391},{"n":"MySQL","id":"SK0218","s":2393,"e":2398},{"n":"MongoDB","id":"SK0215","s":2400,"e":2407},{"n":"Redis","id":"SK0268","s":2413,"e":2418}],"S":[{"k":"missing","a":"thêm","lv":"cao","n":"API Design","id":"SK0004","why":"«Xây dựng backend service và API bằng Python», «tích hợp RESTful API».","s":482,"e":485,"auto":"add","autoWhy":"Quy ước 05/11 (Cường): tin nhắc tới xây dựng, tích hợp hoặc làm việc với API (REST, RESTful, SOAP, GraphQL…) thì gán API Design."},{"k":"missing","a":"thêm","lv":"xem","n":"Agentic AI","id":"SK0010","why":"«xây dựng AI Agent / Agentic Workflow với LangGraph...».","s":1757,"e":1773},{"k":"missing","a":"thêm","lv":"xem","n":"Linux/Unix Shell","id":"SK0183","why":"«Có kinh nghiệm với Docker, CI/CD, Linux hoặc cloud platforms».","s":2321,"e":2326}]},{"id":"c7a50a91c490c519","src":"ITviec","t":"Senior Database Administrator (DBA)","url":"https://itviec.com/it-jobs/senior-database-administrator-dba-ctcp-san-giao-dich-tai-san-ma-hoa-viet-nam-thinh-vuong-caex-3713","x":"Senior Database Administrator (DBA)\nThiết kế, triển khai và vận hành toàn bộ hệ thống cơ sở dữ liệu MySQL và MongoDB cho sàn giao dịch crypto, đảm bảo hệ thống hoạt động ổn định 24/7 với uptime tối thiểu 99.9%. Thiết kế schema và data model cho các nghiệp vụ trading engine, order book, wallet management và KYC/AML; triển khai, quản lý MySQL Cluster (InnoDB Cluster, Group Replication, ProxySQL) và MongoDB Cluster (Replica Sets, Sharded Clusters), đảm bảo high availability, automatic failover và khả năng xử lý tải cao. Tối ưu hiệu năng truy vấn thông qua query optimization, index tuning và execution plan analysis, đảm bảo latency thấp cho matching engine và order processing. Xây dựng và duy trì chiến lược backup/restore, point-in-time recovery cho MySQL và MongoDB, đảm bảo các chỉ số RPO/RTO theo yêu cầu của sàn giao dịch. Triển khai các biện pháp bảo mật database gồm encryption at rest/in transit, access control, audit logging và data masking cho dữ liệu nhạy cảm như PII và thông tin tài chính. Thiết kế và triển khai phương án Disaster Recovery, bao gồm cross-region replication và automated failover; thiết lập hệ thống giám sát và cảnh báo chủ động qua PMM, Grafana, custom dashboards; tham gia on-call rotation để xử lý sự cố database 24/7. Phối hợp với team Development để review, tối ưu database queries và tư vấn thiết kế data model cho các tính năng mới; xây dựng quy trình schema/data migration đảm bảo zero-downtime deployment; cung cấp tài liệu về kiến trúc database, quy trình vận hành và troubleshooting.\nCó tối thiểu 5 năm kinh nghiệm quản trị cơ sở dữ liệu (DBA) trong môi trường production, ưu tiên kinh nghiệm trong lĩnh vực fintech hoặc sàn giao dịch Thành thạo MySQL/MariaDB: InnoDB internals, replication (async, semi-sync, group replication), InnoDB Cluster, ProxySQL, query optimization, partitioning Thành thạo MongoDB: Replica Sets, Sharded Clusters, aggregation pipeline, WiredTiger storage engine, change streams Kinh nghiệm thiết kế và triển khai giải pháp high availability, disaster recovery cho database systems Kinh nghiệm với database performance tuning, capacity planning và troubleshooting trong môi trường high-traffic, low-latency Kiến thức về database security: encryption, access control, audit, compliance (PCI-DSS là lợi thế) Kinh nghiệm với automation tools cho database operations: Ansible, Terraform, scripting (Bash, Python) Kinh nghiệm với containerized databases (Docker, Kubernetes Operators cho MySQL/MongoDB) là lợi thế Tiếng Anh đọc hiểu tài liệu kỹ thuật tốt","sp":"holdout","kp":false,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"Databases","id":"SK0107","s":86,"e":99},{"n":"MySQL","id":"SK0218","s":100,"e":105},{"n":"MongoDB","id":"SK0215","s":109,"e":116},{"n":"Data Modeling","id":"SK0091","s":230,"e":240},{"n":"Query Optimization","id":"SK0257","s":559,"e":577},{"n":"Logging","id":"SK0185","s":932,"e":939},{"n":"Data Security","id":"SK0097","s":2194,"e":2211},{"n":"Grafana","id":"SK0159","s":1175,"e":1182},{"n":"Dashboarding","id":"SK0076","s":1191,"e":1201},{"n":"Terraform","id":"SK0307","s":2347,"e":2356},{"n":"Python","id":"SK0256","s":2375,"e":2381},{"n":"Docker","id":"SK0125","s":2424,"e":2430},{"n":"Kubernetes","id":"SK0175","s":2432,"e":2442}],"S":[{"k":"missing","a":"thêm","lv":"cao","n":"Linux/Unix Shell","id":"SK0183","why":"«scripting (Bash, Python)».","s":2369,"e":2373},{"k":"missing","a":"thêm","lv":"cao","n":"Monitoring","id":"SK0216","why":"«thiết lập hệ thống giám sát và cảnh báo chủ động qua PMM, Grafana».","s":1127,"e":1144},{"k":"missing","a":"thêm","lv":"cao","n":"Alerting","id":"SK0012","why":"«hệ thống giám sát và cảnh báo chủ động».","s":1148,"e":1165},{"k":"missing","a":"thêm","lv":"xem","n":"Data Architecture","id":"SK0079","why":"«cung cấp tài liệu về kiến trúc database».","s":1473,"e":1491}]},{"id":"a7e937cf056d04b1","src":"ITviec","t":"Python / AI Developer (Middle & Above) - Infrastructure","url":"https://itviec.com/it-jobs/python-ai-developer-middle-above-infrastructure-prime-labo-technology-3650","x":"Python / AI Developer (Middle & Above) - Infrastructure\nThe company is scaling up its intake and delivery of AI/Python application projects for clients. This role requires a Python/AI Developer with hands-on, real-world experience and strong ability to work independently — directly developing AI products/features, taking over and operating part of the infrastructure (Infra), and providing technical support to other team members when needed. Key Responsibilities Directly develop Python applications for AI/AI projects (chatbots, LLM integration, RAG, etc.). Integrate APIs from AI platforms (OpenAI, Claude, Gemini, etc.) into client systems. Independently design implementation-level architecture for assigned features/projects, only needing to align with the AI Technical Lead at a high level rather than requiring detailed day-to-day guidance. Takeover, operate, and be able to improve the existing infrastructure (Infra): server configuration, deployment, basic CI/CD, system monitoring. Ensure code quality and write clear technical documentation to reduce dependency on any single individual within the team. Provide technical support and code review for other team members when needed (especially for new Python/AI projects handled by others). Participate in direct technical discussions with clients when needed, including when the AI Technical Lead is unavailable. Reports to AI Technical Lead\nRequirements At least 3–5 years of hands-on Python development experience in a real-world environment (production experience preferred, not only academic/training projects). Has independently delivered at least 1–2 real-world AI/GenAI/LLM projects (chatbot, RAG, AI model integration, etc.) — an important requirement, as this role works independently with limited close supervision. Able to independently design system architecture at a basic-to-intermediate level without needing step-by-step guidance. Experience with Infra/DevOps: Linux servers, Docker, CI/CD, production deployment. Highly self-driven, able to work independently, self-learn, and troubleshoot technical issues. Good communication skills, able to discuss technical topics directly with clients when needed. Good English proficiency for reading technical/requirement documentation and speaking Nice-to-have Prior experience as a Tech Lead or mentor for other developers. Experience working on outsourcing projects for Japanese clients. Experience with FastAPI/Django. Relevant AI/Cloud certifications (AWS, GCP, Azure AI, etc.). Japanese and English certifications (e.g., JLPT for Japanese, TOEIC/IELTS/TOEFL for English).","sp":"holdout","kp":true,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"Python","id":"SK0256","s":0,"e":6},{"n":"Large Language Models","id":"SK0179","s":533,"e":536},{"n":"Retrieval-Augmented Generation","id":"SK0273","s":550,"e":553},{"n":"OpenAI API","id":"SK0231","s":596,"e":602},{"n":"Claude","id":"SK0059","s":604,"e":610},{"n":"Gemini","id":"SK0145","s":612,"e":618},{"n":"CI/CD","id":"SK0050","s":970,"e":975},{"n":"Monitoring","id":"SK0216","s":984,"e":994},{"n":"Generative AI","id":"SK0146","s":1636,"e":1641},{"n":"System Architecture","id":"SK0303","s":1820,"e":1839},{"n":"DevOps","id":"SK0118","s":1934,"e":1940},{"n":"Docker","id":"SK0125","s":1957,"e":1963},{"n":"FastAPI","id":"SK0136","s":2429,"e":2436},{"n":"Django","id":"SK0124","s":2437,"e":2443},{"n":"Cloud Computing","id":"SK0062","s":2457,"e":2462},{"n":"Amazon Web Services","id":"SK0018","s":2479,"e":2482},{"n":"Google Cloud Platform","id":"SK0154","s":2484,"e":2487},{"n":"Azure AI Services","id":"SK0034","s":2489,"e":2497}],"S":[{"k":"missing","a":"thêm","lv":"xem","n":"Microsoft Azure","id":"SK0201","why":"«certifications (AWS, GCP, Azure AI, etc.)» — §9: tên dịch vụ có nêu rõ Azure thì ghi cả nền tảng.","s":2489,"e":2497},{"k":"missing","a":"thêm","lv":"xem","n":"Linux/Unix Shell","id":"SK0183","why":"«Experience with Infra/DevOps: Linux servers, Docker, CI/CD».","s":1942,"e":1955}]},{"id":"ea6186a289c2bf1b","src":"ITviec","t":"Senior Golang Developer (AI, JSON, SQL, Linux)","url":"https://itviec.com/it-jobs/senior-golang-developer-ai-json-sql-linux-persol-cross-technology-vietnam-co-ltd-4746","x":"Senior Golang Developer (AI, JSON, SQL, Linux)\nWe are looking for a Senior Golang Developer to join our engineering team and support the development, enhancement, and production operation of an enterprise AI Chatbot and AI Agent platform. The role will primarily focus on Go/Golang backend development, building and maintaining scalable services, REST APIs, and integrations with AI services, enterprise systems, databases, and knowledge platforms. KEY RESPONSIBILITIES Design, develop, and maintain backend services using Go/Golang. Build and support RESTful APIs and integrations with internal and external systems. Work with microservices and multi-service architectures. Integrate backend services with AI/LLM and RAG-based knowledge systems. Support knowledge ingestion, retrieval, and AI service integrations. Work with SQL databases and troubleshoot data-related issues. Investigate and resolve production issues across applications, APIs, and services. Improve application performance, reliability, and scalability. Work with Docker, Linux, and containerized deployment environments. Participate in code reviews, testing, documentation, and technical knowledge sharing.\nA. MUST-HAVE SKILLS 6+ years of software development experience, including at least 3 years of hands on experience working on Go/Golang projects. Strong hands-on experience with Go/Golang and backend development. Experience building and maintaining production-grade backend services. Strong experience with REST APIs, HTTP/HTTPS, JSON, and API integrations. Experience with microservices or distributed service architectures. Experience with SQL and relational databases. Experience with Docker and Linux environments. Strong debugging, troubleshooting, and production support skills. Experience with authentication and API security, such as JWT and tokenbased authentication. Practical experience or good understanding of AI/LLM applications and RAG (Retrieval-Augmented Generation). Strong problem-solving and communication skills. English skills: Intermediate proficiency in reading and writing, communication skills for day-to-day business interactions. B. NICE-TO-HAVE SKILLS Experience with .NET / C# / ASP.NET Core Web API. Experience with AI Agent or Agentic AI development. Experience with LLM platforms such as OpenAI, Azure OpenAI, Anthropic, or similar. Experience with vector databases or vector search. Experience with Kubernetes, Redis, Kafka, or RabbitMQ. Experience with observability tools such as Prometheus, OpenTelemetry, or Jaeger. Experience working with enterprise systems and complex API integrations","sp":"tune","kp":true,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"Go","id":"SK0151","s":7,"e":9},{"n":"JSON","id":"SK0167","s":29,"e":33},{"n":"SQL","id":"SK0278","s":35,"e":38},{"n":"AI Agents","id":"SK0003","s":220,"e":228},{"n":"Databases","id":"SK0107","s":413,"e":422},{"n":"Microservices","id":"SK0200","s":628,"e":641},{"n":"Large Language Models","id":"SK0179","s":710,"e":713},{"n":"Retrieval-Augmented Generation","id":"SK0273","s":718,"e":721},{"n":"Docker","id":"SK0125","s":1034,"e":1040},{"n":"Relational Databases","id":"SK0271","s":1628,"e":1648},{"n":"Debugging","id":"SK0110","s":1704,"e":1713},{"n":"C#","id":"SK0048","s":2182,"e":2184},{"n":"Agentic AI","id":"SK0010","s":2237,"e":2247},{"n":"OpenAI API","id":"SK0231","s":2299,"e":2305},{"n":"Microsoft Azure","id":"SK0201","s":2307,"e":2312},{"n":"Anthropic API","id":"SK0021","s":2321,"e":2330},{"n":"Vector Database","id":"SK0317","s":2360,"e":2376},{"n":"Vector Search","id":"SK0318","s":2380,"e":2393},{"n":"Kubernetes","id":"SK0175","s":2411,"e":2421},{"n":"Redis","id":"SK0268","s":2423,"e":2428},{"n":"Apache Kafka","id":"SK0027","s":2430,"e":2435},{"n":"Observability","id":"SK0230","s":2466,"e":2479},{"n":"Prometheus","id":"SK0248","s":2494,"e":2504}],"S":[{"k":"label","a":"sửa bằng chứng","lv":"xem","n":"Go","id":"SK0151","why":"Bằng chứng là «Go» cắt từ «Golang» trong tiêu đề; nên dùng «Go/Golang» trong phần trách nhiệm.","s":523,"e":532,"li":0},{"k":"missing","a":"thêm","lv":"cao","n":"API Design","id":"SK0004","why":"«Build and support RESTful APIs», «Strong experience with REST APIs ... API integrations».","s":347,"e":356,"auto":"add","autoWhy":"Quy ước 05/11 (Cường): tin nhắc tới xây dựng, tích hợp hoặc làm việc với API (REST, RESTful, SOAP, GraphQL…) thì gán API Design."},{"k":"missing","a":"thêm","lv":"xem","n":"Linux/Unix Shell","id":"SK0183","why":"Tiêu đề «(AI, JSON, SQL, Linux)», «Experience with Docker and Linux environments».","s":40,"e":45},{"k":"missing","a":"thêm","lv":"xem","n":"Message Queues","id":"SK0197","why":"«Kubernetes, Redis, Kafka, or RabbitMQ».","s":2440,"e":2448},{"k":"missing","a":"thêm","lv":"xem","n":"Distributed Systems","id":"SK0123","why":"«Experience with microservices or distributed service architectures».","s":1569,"e":1602}]},{"id":"a9df4469092f56be","src":"ITviec","t":"Senior Presales Consultant – AI Solutions","url":"https://itviec.com/it-jobs/senior-presales-consultant-ai-solutions-nami-technology-joint-stock-company-1005","x":"Senior Presales Consultant – AI Solutions\nAbout us: NamiTech is a leading tech startup in Vietnam focused on AI applications. With strong support from FPT Corporation and Thiên Việt Investment Fund (TVS), we're committed to developing world-class AI technology products for both local and global markets. Our lineup includes noise cancellation, voice biometrics, speech recognition, sentiment analysis, and natural language processing (NLP). Backed by a diverse team of experts and a culture of teamwork, we aim to become Vietnam's next unicorn, expanding our AI Made in Vietnam products worldwide. Learn more about NamiTech: Visit our website News Links: Tuoitre.vn - CEO of a technology company resigns to start a business with AI Nhipcaudautu.vn - NamiTech: TVS's vision of Vietnamese AI Responsibilities: Conduct customer discovery sessions to assess current systems/processes and identify pain points. Gather and validate requirements with internal stakeholders; ensure feasibility and propose solutions. Prepare and deliver solution demos and presentations to customer teams and leadership. Lead bidding activities: write proposals, build compliance matrix, and coordinate BOM/pricing. Key Responsibilities: Consulting & Discovery: Meet with customers directly to assess the current state of systems and business processes (Contact Center, related systems, and IT infrastructure). Identify pain points and propose suitable solutions. Requirements Analysis: Work closely with the PO, SRE, BA, and other stakeholders to clarify customer requirements, validate feasibility between customer expectations and system capabilities, and provide appropriate recommendations. Solution Presentation: Develop and deliver highly persuasive solution demos and presentation decks to customer teams and leadership. Bidding / Tendering: Lead the creation of proposal documents, build the technical compliance matrix, and coordinate with internal teams to finalize pricing and BOM (Bill of Materials).\nQualifications & Skills: Experience: Minimum 3- 5 years of experience in Presales or Software/IT Systems Solution Consulting for B2B/Enterprise customers. Preferred: Experience in Contact Center, CRM, or AI NLP domains. Soft skills: Excellent presentation and negotiation skills; strong ability to “translate” technical concepts into business language. Knowledge: Solid understanding of AI models (LLMs, NLP), cloud infrastructure (AWS, Azure), and operational business systems. Strong task management skills; able to work under high pressure with a proactive mindset. Eager to learn; strong self-learning ability and effective information research skills to support work. Good English proficiency.","sp":"tune","kp":false,"note":"NLP có trong yêu cầu, không chỉ trong giới thiệu công ty.","L":[{"n":"CRM","id":"SK0051","s":2186,"e":2189},{"n":"Natural Language Processing","id":"SK0220","s":436,"e":439},{"n":"Large Language Models","id":"SK0179","s":2388,"e":2392},{"n":"Cloud Computing","id":"SK0062","s":2400,"e":2420},{"n":"Amazon Web Services","id":"SK0018","s":2422,"e":2425},{"n":"Microsoft Azure","id":"SK0201","s":2427,"e":2432}],"S":[{"k":"label","a":"sửa bằng chứng","lv":"cao","n":"Natural Language Processing","id":"SK0220","why":"Bằng chứng đang nằm trong phần giới thiệu sản phẩm công ty (§5 loại); bằng chứng đúng là «AI models (LLMs, NLP)» trong yêu cầu.","s":2394,"e":2397,"li":1},{"k":"label","a":"xem","lv":"xem","n":"CRM","id":"SK0051","why":"«Experience in Contact Center, CRM, or AI NLP domains» — kinh nghiệm lĩnh vực, chưa chắc là kỹ năng kỹ thuật.","li":0}]},{"id":"0b39872d0c820562","src":"ITviec","t":"Senior Automation Test (AI, QA QC, API)","url":"https://itviec.com/it-jobs/senior-automation-test-ai-qa-qc-api-floware-1219","x":"Senior Automation Test (AI, QA QC, API)\nOVERVIEW We are seeking a detail-oriented and collaborative API Testing Engineer to join our Agile development team. You will be responsible for ensuring the quality and reliability of backend APIs through automated and manual testing, while actively collaborating with developers, product managers, and stakeholders to deliver high-quality software. In this role, you will embrace AI-assisted testing by leveraging modern AI tools to accelerate test design, automation, debugging, and quality analysis, enabling faster and smarter software delivery. WHAT YOU’LL DO Collaborate closely with cross-functional Agile teams, including Backend developers, Frontend developers, Product Owners, and Project Managers to understand requirements and ensure comprehensive Backend API test coverage. Analyze functional and technical requirements, identify defects early, and ensure sufficient test coverage. Design, develop, and maintain automated test scripts for Backend APIs using tools such as Postman, Python, or similar technologies. Execute comprehensive testing for the email system, including API, IMAP, SMTP, JMAP, migration, synchronization, authentication, performance, reliability, and end-to-end workflows. Perform system and service benchmarking to evaluate performance, scalability, stability, and resource utilization under different workloads. Conduct performance, load, and stress testing to identify bottlenecks and validate system behavior under expected and peak traffic conditions. Support Continuous Integration and Continuous Deployment (CI/CD) by integrating automated API tests into Jenkins pipelines. Monitor API performance, test execution results, and system reliability through analytics and reporting tools (e.g., Allure Reports). Support Frontend developers during API integration by troubleshooting issues, validating API behavior, and verifying new features and enhancements. Participate in daily stand-ups, sprint planning, backlog refinement, API reviews, internal demos, and cross-functional team demos.\nAt least 4 years in automation testing and ensuring product quality. Strong understanding of end-to-end automation testing processes Experience using AI tools (Claude, Cursor, Copilot, ChatGPT, etc.) to improve testing productivity. Hands-on experience with a programming language such as Python Experience in API automation testing (Python, Java, JMeter, Postman, etc.) Experience in CI/CD process (Github, Jenkins, Gitlab CI, nightly run, etc.) Experience in Performance and Security testing is a plus. Have strong analytical and problem-solving skills. Have a proactive and good work relationship with other team members.","sp":"holdout","kp":false,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"Debugging","id":"SK0110","s":511,"e":520},{"n":"Python","id":"SK0256","s":1035,"e":1041},{"n":"CI/CD","id":"SK0050","s":1591,"e":1596},{"n":"Reporting","id":"SK0272","s":1751,"e":1760},{"n":"Claude","id":"SK0059","s":2230,"e":2236},{"n":"ChatGPT","id":"SK0056","s":2255,"e":2262},{"n":"Java","id":"SK0168","s":2412,"e":2416}],"S":[{"k":"missing","a":"thêm","lv":"xem","n":"Monitoring","id":"SK0216","why":"«Monitor API performance, test execution results, and system reliability».","s":1657,"e":1680}]},{"id":"ad743ae699103d9b","src":"ITviec","t":"Senior Product Data Analyst (SQL/Python/R)","url":"https://itviec.com/it-jobs/senior-product-data-analyst-sql-python-r-amanotes-4304","x":"Senior Product Data Analyst (SQL/Python/R)\nAbout the team Inside our team: Strong data engineering foundation team with sustainable data pipelines. Highly mature Data team with a mindset of Data as a Product. Highly data-driven culture across multiple teams with a variety of data problems requiring diversified analytics methods. You will learn and grow deeply in Analytics while solving the problems. About the role As an Amanotes’ product Data Analyst, you have the chance to deal with data of 3+ billion users to generate accurate, actionable, and timely insights for the products team, in order to boost user understanding and product optimization What you will do Insights are key. We need deep-dive insights to improve user experience and product/process optimization, driving actions from top-down levels to bottom-up. Use analytical techniques such as EDA, statistical tests, time series analysis, funnel analysis, user journey analysis, clustering and other segmentation methods, etc. to extract patterns and user/product insights from behavioral user data. Conduct pre-AB test exploratory analysis to provide data-driven insights for product feature design. Conduct post-AB test deep-dive explanatory and exploratory analysis to validate key hypotheses, providing solid learning for next steps. Construct dashboards to monitor business performance. Proactively communicate with the business team (cross-functional teams) to understand their needs and to transform business questions into analytics and build data models to solve them. Collaborate closely with the Data Engineering team to understand the centralized data warehouse and pipeline, extracting data from multiple sources.\nQualifications Bachelor’s degree in Business, Economics, Statistics, Math, Computer Science, or related majors. +3 years of experience in the data/analytics field. Strong product mindset, striving to improve user experience and product optimization; not stopping at data but providing product-driven solutions and consultation. Very good at logical thinking and able to learn new things quickly, attention to details. Strong analytics/statistics skills with experience working with a large amount of data (clean, visualize, extract insights, etc.). Strong experience using SQL/Python/R for data extraction and manipulation. Be confident to present the ideas and translating technical concepts and data into understandable reports/presentations. Be able to give clear and actionable recommendations based on data findings. Prefer experience on user segmentation modeling and product solutions based on models. Have a growth mindset, especially be comfortable with agile, strategic projects with ambiguous approaches. Nice to have: basic understanding of game industry and good command of English.","sp":"tune","kp":false,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"Statistical Analysis","id":"SK0292","s":866,"e":883},{"n":"Funnel Analysis","id":"SK0144","s":907,"e":922},{"n":"Clustering","id":"SK0063","s":947,"e":957},{"n":"Segmentation","id":"SK0281","s":968,"e":980},{"n":"A/B Testing","id":"SK0001","s":1080,"e":1087},{"n":"Dashboarding","id":"SK0076","s":1316,"e":1326},{"n":"Data Modeling","id":"SK0091","s":1519,"e":1530},{"n":"Data Warehouse","id":"SK0102","s":1627,"e":1641},{"n":"Data Pipelines","id":"SK0093","s":137,"e":145},{"n":"Statistics","id":"SK0295","s":2130,"e":2147},{"n":"Data Visualization","id":"SK0101","s":2208,"e":2217},{"n":"SQL","id":"SK0278","s":29,"e":32},{"n":"Python","id":"SK0256","s":33,"e":39},{"n":"R","id":"SK0258","s":40,"e":41}],"S":[{"k":"label","a":"xem","lv":"xem","n":"Data Pipelines","id":"SK0093","why":"Bằng chứng nằm ở «About the team» (mô tả đội, §5 loại); phần việc chỉ là «understand the centralized data warehouse and pipeline».","li":8},{"k":"missing","a":"thêm","lv":"cao","n":"Data Analysis","id":"SK0078","why":"«EDA», «exploratory analysis», «deep-dive explanatory and exploratory analysis».","s":1088,"e":1108},{"k":"missing","a":"thêm","lv":"xem","n":"Reporting","id":"SK0272","why":"«translating technical concepts and data into understandable reports/presentations».","s":2417,"e":2438}]},{"id":"d17dc4bd6eba3779","src":"ITviec","t":"Senior Database Administrator (PostgreSQL/AWS/Aurora)","url":"https://itviec.com/it-jobs/senior-database-administrator-postgresql-aws-aurora-katalon-0119","x":"Senior Database Administrator (PostgreSQL/AWS/Aurora)\nFounded in 2016, Katalon is the category leader in AI-augmented software testing, empowering hybrid testers—those blending manual, automation, and AI skills—to deliver exceptional digital experiences. Katalon enables software teams of any size to deliver world-class customer experiences faster, easier, and more efficiently. Since its first launch, Katalon has experienced tremendous growth, serving more than 30,000 teams across 80+ countries, many of which are in the Fortune Global 500. Katalon has been named a G2 Leader in software testing for 11 consecutive quarters and a Great Place to Work for three consecutive years. About the role We are looking for a Senior Database Engineer / DBA to own Katalon’s production database environment, with a primary focus on PostgreSQL / AWS Aurora . You will manage approximately 10 production database clusters hosting customer data on AWS , working closely with our Engineering team in Vietnam on database performance, reliability, architecture, security, and future upgrades. We are open to strong Oracle DBA profiles with solid cross-database fundamentals and the ability to work with PostgreSQL/Aurora. Key Responsibilities Manage and maintain production PostgreSQL / AWS Aurora databases. Troubleshoot and resolve performance, availability, locking, concurrency, and query issues. Perform query tuning, indexing, and database performance optimization. Design databases and schemas for new customer workloads. Manage high availability, replication, backup/recovery, and failover. Monitor database health, capacity, and performance using CloudWatch, Performance Insights, and Enhanced Monitoring . Manage database users, roles, permissions, and security controls. Plan and execute database upgrades, migrations, and maintenance. Partner closely with Engineering teams on database-related requirements and production incidents.\nJob Requirements 5+ years of experience in DBA / Database Engineering . Strong experience with production database administration and troubleshooting. Strong knowledge of performance tuning, SQL, indexing, HA/replication, backup & recovery, and database security. Experience with PostgreSQL/Aurora OR Oracle . Strong understanding of database architecture and operational best practices. Good communication and collaboration skills. Technology Primary: PostgreSQL, AWS Aurora, AWS RDS, CloudWatch Oracle profiles are welcome: Candidates with strong Oracle DBA experience and transferable database fundamentals are encouraged to apply. Experience with PostgreSQL/Aurora or Oracle-to-PostgreSQL migration is a plus. Nice to Have Experience with both Oracle and PostgreSQL. AWS database experience. Experience supporting customer-facing SaaS production environments. Experience in a lean, high-ownership DBA environment.","sp":"tune","kp":true,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"Databases","id":"SK0107","s":1284,"e":1293},{"n":"PostgreSQL","id":"SK0243","s":31,"e":41},{"n":"Amazon Web Services","id":"SK0018","s":42,"e":45},{"n":"Oracle Database","id":"SK0236","s":1101,"e":1107},{"n":"Query Optimization","id":"SK0257","s":1395,"e":1407},{"n":"Monitoring","id":"SK0216","s":1585,"e":1608},{"n":"SQL","id":"SK0278","s":38,"e":41},{"n":"Data Security","id":"SK0097","s":2176,"e":2193}],"S":[{"k":"label","a":"sửa bằng chứng","lv":"cao","n":"SQL","id":"SK0278","why":"Bằng chứng trỏ vào «SQL» trong «PostgreSQL» ở tiêu đề; bằng chứng đúng là «performance tuning, SQL, indexing».","s":2122,"e":2125,"li":6},{"k":"missing","a":"thêm","lv":"cao","n":"Data Modeling","id":"SK0091","why":"«Design databases and schemas for new customer workloads»; tin J41 gán Data Modeling cho thiết kế schema.","s":1458,"e":1486},{"k":"missing","a":"thêm","lv":"xem","n":"Data Architecture","id":"SK0079","why":"«Strong understanding of database architecture».","s":2265,"e":2286}]},{"id":"dee32c5ca8844d69","src":"ITviec","t":"Data Scientist - Data Division","url":"https://itviec.com/it-jobs/data-scientist-data-division-mb-bank-0231","x":"Data Scientist - Data Division\n2026TD450984 - Chuyên viên, Chuyên viên Cao cấp Khoa học Dữ liệu - Data Scientist - Khối Dữ liệu - Thực hiện các nhiệm vụ định kì của phòng theo lĩnh vực được phân công bao gồm: khai phá dữ liệu, phân tích chuyên sâu, xây dựng và làm giàu kho dữ liệu đặc trưng, phát triển mô hình phục vụ kinh doanh (tiềm năng bán, upsale, cross sale, chống churn ...) - Thực hiện xây dựng và phát triển các mô hình phục vụ đáp ứng nhu cầu và hỗ trợ ra quyết định kinh doanh trên lĩnh vực được phân công - Thực hiện công tác điều chỉnh, vận hành, tối ưu hóa các mô hình hiện hữu phục vụ đáp ứng nhu cầu và đạt hiệu quả kinh doanh cao. - Tham gia và báo cáo lãnh đạo dự án, lãnh đạo khối các dự án về công tác xây dựng mô hình phân tích dữ liệu được phân công\n- Cử nhân chuyên ngành kinh tế, tài chính, ngân hàng, khoa học dữ liệu, khoa học máy tính, thống kê, Toán tin... hoặc các chuyên ngành liên quan - Ưu tiên có chứng chỉ hoặc có kinh nghiệm sử dụng thành thạo ngôn ngữ, công cụ xử lý dữ liệu lớn, và các chứng chỉ kĩ năng về khoa học dữ liệu: Data science, Data engieering, Data analysis, Python, Spark, SQL, Tableau, Power BI, Oracle, Data visualization - Tối thiểu có kinh nghiệm 02 năm phân tích dữ liệu, khoa học máy tính hoặc các vị trí tương đương làm việc với dữ liệu lớn, có kinh nghiệm xây dựng các mô hình dự đoán, học máy - Có năng lực lập trình sử dụng những ngôn ngữ phổ biến trong xử lý dữ liệu như Python, R, Matlab, Sql,... - Có kinh nghiệm tương tác, sử dụng, phát triển, xử lý dữ liệu trên các hệ thống dữ liệu lớn hoặc các công cụ xử lý dữ liệu lớn Spark, Hadoop, S3 storage... - Có hiểu biết về các thuật toán nói chung, đặc biệt các thuật toán học máy. - Hiểu và sử dụng kiến thức thống kê, toán học ứng dụng trong quản lý chất lượng và phát triển mô hình. - Ưu tiên có hiểu biết hoặc đã sử dụng các thuật toán khai phá dữ liệu trong thực tế. - Có kinh nghiệm sử dụng các công cụ trực quan hóa dữ liệu, matplotlib, tableau,... - Có tư duy logic tốt, có khả năng thiết kế, giải quyết các bài toán, vấn đề liên quan đến dữ liệu và sử dụng dữ liệu. - Ưu tiên có kinh nghiệm trong lĩnh vực tài chính - ngân hàng MB Bank yêu cầu ứng viên ứng tuyển cần cung cấp chi tiết các thông tin sau: - Thông tin cá nhân: Họ và tên, Ngày tháng năm sinh, Giới tính - Số điện thoại và Email liên hệ - Trình độ học vấn, Trường đã tốt nghiệp - Kinh nghiệm làm việc - Từ 3 - 5 kỹ năng nổi bật Vì sao Bạn nên đảm bảo đầy đủ thông tin khi ứng tuyển? - Hồ sơ của Bạn sẽ được đánh giá nhanh chóng. - Đối với các hồ sơ đáp ứng đầy đủ thông tin và tiêu chí tuyển dụng phù hợp, MB Bank sẽ chủ động liên hệ phỏng vấn trong thời gian sớm nhất. - Ứng viên vui lòng kiểm tra email và điện thoại thường xuyên để không bỏ lỡ lịch hẹn phỏng vấn. Cập nhật ngay thông tin mới nhất về các Chương trình do MB tổ chức tại Trang tuyển dụng MB Careers Và các Fanpage: • MB Careers • Ai Yêu Miền Bắc hơn MBers? • Ai Yêu Miền Trung hơn MBers? • Ai Yêu Miền Nam hơn MBers","sp":"tune","kp":false,"note":"Các nhãn từ bản dịch tiếng Việt và Feature Store cần người rà soát xác nhận.","L":[{"n":"Data Mining","id":"SK0090","s":209,"e":225},{"n":"Data Analysis","id":"SK0078","s":741,"e":758},{"n":"Feature Store","id":"SK0139","s":270,"e":291},{"n":"Predictive Modeling","id":"SK0246","s":1329,"e":1344},{"n":"Machine Learning","id":"SK0195","s":851,"e":858},{"n":"Big Data","id":"SK0043","s":1005,"e":1016},{"n":"Python","id":"SK0256","s":1110,"e":1116},{"n":"Apache Spark","id":"SK0028","s":1118,"e":1123},{"n":"SQL","id":"SK0278","s":1125,"e":1128},{"n":"Tableau","id":"SK0304","s":1130,"e":1137},{"n":"Power BI","id":"SK0244","s":1139,"e":1147},{"n":"Oracle Database","id":"SK0236","s":1149,"e":1155},{"n":"Data Visualization","id":"SK0101","s":1157,"e":1175},{"n":"R","id":"SK0258","s":1442,"e":1443},{"n":"Apache Hadoop","id":"SK0024","s":1596,"e":1602},{"n":"Amazon S3","id":"SK0016","s":1604,"e":1606},{"n":"Statistics","id":"SK0295","s":1713,"e":1731}],"S":[{"k":"label","a":"sửa bằng chứng","lv":"cao","n":"Machine Learning","id":"SK0195","why":"Bằng chứng trỏ vào «học máy» bên trong «khoa học máy tính» (ngành học); bằng chứng đúng là «mô hình dự đoán, học máy» hoặc «thuật toán học máy».","s":1686,"e":1693,"li":4},{"k":"label","a":"xem","lv":"xem","n":"Feature Store","id":"SK0139","why":"«xây dựng và làm giàu kho dữ liệu đặc trưng» — dịch sát nghĩa feature store; Codex cũng ghi chú cần xác nhận.","li":2},{"k":"missing","a":"thêm","lv":"xem","n":"Customer Analytics","id":"SK0071","why":"«phát triển mô hình phục vụ kinh doanh (tiềm năng bán, upsale, cross sale, chống churn ...)» (§12.1).","s":367,"e":378}]},{"id":"5da5a30910b64f2d","src":"ITviec","t":"AI Consultant (AI, HPC)","url":"https://itviec.com/it-jobs/ai-consultant-ai-hpc-fpt-is-5406","x":"AI Consultant (AI, HPC)\n- Nghiên cứu bài toán AI điển hình đã triển khai tại các quốc gia trên thế giới theo các lĩnh vực: an ninh, tài chính, y tế, nông nghiệp, xây dựng, giáo dục, công thương, văn hóa du lịch, tư pháp, nội vụ, KH&CN...đề xuất khả năng áp dụng ở Việt Nam; - Làm việc trực tiếp với khách hàng để làm rõ bài toán nghiệp vụ và đặc tính tải công việc: huấn luyện mô hình (pre-training, fine-tuning), suy luận (inference/serving), RAG, mô phỏng khoa học (CFD, FEA, weather, genomics)...từ đó xây dựng các bài toán AI, HPC phù hợp cho khách hàng dựa trên dữ liệu khảo sát đã thu thập và kinh nghiệm quốc tế; - Phân tích và phân loại bài toán theo nhiều chiều: quản lý nhà nước / phát triển kinh tế; triển khai ngay / triển khai giai đoạn sau; mức độ sẵn sàng dữ liệu của lĩnh vực đó tại Việt Nam...; - Quy đổi yêu cầu nghiệp vụ thành thông số kỹ thuật: số lượng GPU, dung lượng bộ nhớ HBM, băng thông liên kết, throughput lưu trữ, yêu cầu điện, làm mát...; - Đánh giá hiện trạng hạ tầng, phân tích khoảng trống (gap analysis) và đề xuất lộ trình đầu tư theo giai đoạn; - Hỗ trợ thiết kế kiến trúc hạ tầng cho AI, HPC: cụm tính toán, lưu trữ, mạng, phần mềm nền tảng...; - Xây dựng slide thuyết trình cho khách hàng; - Thực hiện báo cáo theo quy định và yêu cầu của cấp qu
