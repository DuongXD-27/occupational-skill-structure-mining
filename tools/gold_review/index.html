<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duyệt gold kỹ năng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Bố cục: thanh trên (người duyệt, tiến độ, xuất) · cột trái danh sách 50 tin · bên phải văn bản tin có tô bút dạ + bảng nhãn. Điện thoại: xếp một cột. */
:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#1b2230; --muted:#5b6474; --line:#dce0e7; --hover:#eef0f4;
  --accent:#2c4fb3; --accent-ink:#ffffff;
  --keep-bg:#d7efe1; --keep:#16674a;
  --drop-bg:#f7dada; --drop:#a2342f;
  --sug-bg:#fbe5ad; --sug:#7f5200;
  --mine-bg:#dbe5ff; --mine:#2c4fb3;
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151b; --panel:#1a1e26; --ink:#e5e8ee; --muted:#9aa3b2; --line:#2b313c; --hover:#232834;
  --accent:#8fa8ff; --accent-ink:#0e1220;
  --keep-bg:#163a2a; --keep:#82d6ab; --drop-bg:#45201e; --drop:#f29a93;
  --sug-bg:#43361a; --sug:#f1c56a; --mine-bg:#1f2a4b; --mine:#a8beff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151b; --panel:#1a1e26; --ink:#e5e8ee; --muted:#9aa3b2; --line:#2b313c; --hover:#232834;
  --accent:#8fa8ff; --accent-ink:#0e1220;
  --keep-bg:#163a2a; --keep:#82d6ab; --drop-bg:#45201e; --drop:#f29a93;
  --sug-bg:#43361a; --sug:#f1c56a; --mine-bg:#1f2a4b; --mine:#a8beff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.55 var(--f-ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12px}
.muted{color:var(--muted)}
h1{font-size:19px;font-weight:600;margin:0;letter-spacing:-.01em}
h2{font-size:17px;font-weight:600;margin:0;text-wrap:balance}
h3{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;max-width:1400px;margin:0 auto 14px}
.top .grow{flex:1 1 auto}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:1px 9px;font-size:12px;white-space:nowrap;background:var(--panel)}
.chip.kp{border-color:var(--sug);color:var(--sug)}
.chip.ho{border-color:var(--mine);color:var(--mine)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;width:160px}
.bar i{display:block;height:100%;background:var(--keep)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:5px 11px;cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.banner{max-width:1400px;margin:0 auto 12px;border:1px solid var(--sug);background:var(--sug-bg);color:var(--ink);border-radius:8px;padding:8px 12px}
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;max-width:1400px;margin:0 auto;align-items:start}
.list{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:sticky;top:max(10px,env(safe-area-inset-top,0px));max-height:calc(100vh - 30px);display:flex;flex-direction:column}
.filters{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.filters button{border:0;background:none;padding:2px 8px;border-radius:5px;cursor:pointer;font-size:12px;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--hover);color:var(--ink);font-weight:500}
.items{overflow:auto}
.item{display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px;padding:7px 10px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer}
.item:hover{background:var(--hover)}
.item[aria-current="true"]{background:var(--mine-bg)}
.item .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.item .m{font-size:11px;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);margin-top:5px}
.dot.part{border-color:var(--sug);background:linear-gradient(90deg,var(--sug) 50%,transparent 50%)}
.dot.done{border-color:var(--keep);background:var(--keep)}
.jobsel{display:none}
.job{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.jhead{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:baseline}
.jhead .grow{flex:1 1 300px;min-width:0}
.jhead a{color:var(--accent)}
.step{grid-column:1/-1;border-left:3px solid var(--sug);padding:6px 12px;background:var(--panel);border-radius:0 8px 8px 0}
.txt{white-space:pre-wrap;word-wrap:break-word;font-size:14.5px;line-height:1.75;max-height:72vh;overflow:auto;max-width:68ch}
.txt mark{background:none;color:inherit;border-radius:3px;padding:1px 0;cursor:pointer}
.txt mark.keep{background:var(--keep-bg)}
.txt mark.drop{background:var(--drop-bg);text-decoration:line-through;text-decoration-color:var(--drop)}
.txt mark.sug{background:var(--sug-bg);box-shadow:inset 0 -2px 0 var(--sug)}
.txt mark.mine{background:var(--mine-bg);box-shadow:inset 0 -2px 0 var(--mine)}
.txt mark.flash{outline:2px solid var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.lg-keep::before{background:var(--keep-bg)}.lg-drop::before{background:var(--drop-bg)}.lg-sug::before{background:var(--sug-bg)}.lg-mine::before{background:var(--mine-bg)}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .nm{font-weight:500}
.row .ev{font-family:var(--f-mono);font-size:12px;color:var(--muted);word-break:break-word}
.row .why{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.row.flag .nm::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sug);margin-right:6px;vertical-align:1px}
.row.flash{background:var(--hover)}
.choices{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.choices button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 9px;font-size:12.5px;cursor:pointer}
.choices button[aria-pressed="true"]{border-color:var(--accent);background:var(--mine-bg);color:var(--ink);font-weight:500}
.tog{border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer;background:var(--keep-bg);color:var(--keep);white-space:nowrap}
.tog.off{background:var(--drop-bg);color:var(--drop)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px}
.add{border:1px dashed var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.add input{width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--bg)}
.hits{display:flex;flex-wrap:wrap;gap:6px}
.hits button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:2px 8px;font-size:12.5px;cursor:pointer}
.hits button:hover{border-color:var(--accent)}
textarea{width:100%;min-height:62px;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:var(--bg);resize:vertical}
.foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.agree{max-width:1400px;margin:16px auto 0}
.agree table{border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.agree td,.agree th{padding:4px 12px 4px 0;text-align:left;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}
.empty{color:var(--muted);font-size:13px}
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr)}
  .list{display:none}
  .jobsel{display:block;width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel);margin-bottom:10px}
  .job{grid-template-columns:minmax(0,1fr)}
  .txt{max-height:none}
  .bar{width:100px}
}
@media (prefers-reduced-motion:no-preference){.row,.txt mark{transition:background .15s}}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1>Duyệt gold kỹ năng</h1>
    <div class="muted" style="font-size:12.5px">50 tin pilot ITviec · 634 nhãn nháp do Codex gán · 99 góp ý lượt hai cần quyết định</div>
  </div>
  <div class="grow"></div>
  <div class="who">

  </div>
</header>
<div class="banner" id="banner" hidden></div>
<div class="wrap">
  <nav class="list" aria-label="Danh sách tin">

      <button type="button" data-f="all" aria-pressed="true">Tất cả</button>

      <button type="button" data-f="holdout" aria-pressed="false">Holdout</button>
    </div>
    <div class="items" id="items"></div>
  </nav>
  <main>
    <select class="jobsel" id="jobsel" aria-label="Chọn tin"></select>
    <div class="job" id="job"></div>
  </main>
</div>

hệ thống dữ liệu của Ngân hàng. Làm việc với cơ sở dữ liệu, kho dữ liệu và các nền tảng xử lý dữ liệu lớn. Theo dõi chất lượng dữ liệu; hỗ trợ phát hiện và xử lý các vấn đề phát sinh trong quá trình vận hành. Tham gia tối ưu hiệu suất, tính ổn định và khả năng mở rộng của hệ thống dữ liệu. Phối hợp với Data Analyst, Data Scientist và các đơn vị công nghệ để đáp ứng nhu cầu khai thác dữ liệu. Tham gia các chương trình đào tạo, dự án thực tế và hoạt động phát triển năng lực dành cho Fresh DE.\nThời gian tham gia chương trình: Toàn thời gian Sinh viên năm cuối hoặc đã tốt nghiệp các ngành Công nghệ thông tin, Khoa học máy tính, Hệ thống thông tin, Khoa học dữ liệu hoặc ngành liên quan. Có kiến thức nền tảng về cơ sở dữ liệu và sử dụng được SQL. Biết một ngôn ngữ lập trình như Python, Java hoặc Scala là lợi thế. Có hiểu biết cơ bản về ETL/ELT, Data Warehouse, Data Lake hoặc các hệ thống xử lý dữ liệu. Ưu tiên ứng viên đã tiếp cận các công nghệ như Spark, Kafka, Airflow, Hadoop, Cloud hoặc công cụ tương đương. Có tư duy logic, khả năng phân tích và tinh thần chủ động giải quyết vấn đề. Ham học hỏi, kiên trì, có trách nhiệm và mong muốn phát triển lâu dài trong lĩnh vực Data Engineering.","sp":"tune","kp":false,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"Data Pipelines","id":"SK0093","s":231,"e":272},{"n":"ETL","id":"SK0128","s":304,"e":307},{"n":"ELT","id":"SK0127","s":308,"e":311},{"n":"Databases","id":"SK0107","s":391,"e":404},{"n":"Data Warehouse","id":"SK0102","s":1197,"e":1211},{"n":"Data Lake","id":"SK0084","s":1213,"e":1222},{"n":"Data Quality","id":"SK0094","s":462,"e":480},{"n":"SQL","id":"SK0278","s":1092,"e":1095},{"n":"Python","id":"SK0256","s":1129,"e":1135},{"n":"Java","id":"SK0168","s":1137,"e":1141},{"n":"Scala","id":"SK0280","s":1147,"e":1152},{"n":"Apache Spark","id":"SK0028","s":1303,"e":1308},{"n":"Apache Kafka","id":"SK0027","s":1310,"e":1315},{"n":"Apache Airflow","id":"SK0022","s":1317,"e":1324},{"n":"Apache Hadoop","id":"SK0024","s":1326,"e":1332},{"n":"Cloud Computing","id":"SK0062","s":1334,"e":1339}],"S":[{"k":"missing","a":"thêm","lv":"cao","n":"Big Data","id":"SK0043","why":"«Làm việc với cơ sở dữ liệu, kho dữ liệu và các nền tảng xử lý dữ liệu lớn».","s":425,"e":451}]},{"id":"62d426ca2fb898a6","src":"ITviec","t":"Product & AI Automation Intern","url":"https://itviec.com/it-jobs/product-ai-automation-intern-phu-hung-securities-phs-0435","x":"Product & AI Automation Intern\n1. Product Research & Documentation Conduct market research and competitor analysis to identify emerging trends, product features, and user pain points. Support the team in preparing Business Requirement Documents (BRD) and Functional Requirement Documents (FRD). Define and map user journeys and logic flows for new product features. Assist in synthesizing research insights to support product improvement initiatives. 2. UI/UX Prototyping (Figma) Design wireframes, mockups, and interactive prototypes using Figma based on approved product requirements. Simulate user interactions to validate product logic and user experience before the development phase. Collaborate with the product team to refine design solutions. 3. AI & Workflow Automation Design and build automation workflows using low-code tools (e.g., n8n) to improve internal operational efficiency. Research and experiment with AI agents and Large Language Models (LLM) to automate repetitive tasks or support data analysis. Support the integration of automation solutions into existing workflows.\nFinal-year students or recent graduates majoring in Information Technology, Computer Science, Artificial Intelligence or related fields. Strong logical thinking, attention to detail, and good analytical skills. Proactive, responsible, eager to learn, and able to work effectively in a team. Basic exposure to software testing, market research, or survey projects is a plus. Interest in digital products, AI applications, UI/UX, or workflow automation y Chain, Finance & Accounting. Strong analytical, problem-solving, communication, teamwork, and attention-to-detail skills. SAP Certification is a plus.","sp":"holdout","kp":false,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"SQL","id":"SK0278","s":34,"e":37},{"n":"Python","id":"SK0256","s":39,"e":45},{"n":"Databases","id":"SK0107","s":1348,"e":1356},{"n":"Data Management","id":"SK0087","s":1228,"e":1243},{"n":"Data Quality","id":"SK0094","s":768,"e":780},{"n":"Data Validation","id":"SK0099","s":376,"e":384}],"S":[{"k":"missing","a":"thêm","lv":"xem","n":"Reporting","id":"SK0272","why":"«Generate and maintain master data quality reports».","s":761,"e":788}]},{"id":"692e80013b1693e3","src":"ITviec","t":"Data Scientist (Python, SQL, Machine Learning)","url":"https://itviec.com/it-jobs/data-scientist-python-sql-pandas-numpy-blue-technology-0423","x":"Data Scientist (Python, SQL, Machine Learning)\nXây dựng mô hình tìm kiếm khách hàng, mô hình chấm điểm gian lận/tín nhiệm, các mô hình cảnh báo sớm phục vụ cho các sản phẩm tài chính. Phối hợp với Product và Business để định nghĩa các sản phẩm Machine Learning, tập trung chủ yếu vào sản phẩm tài chính vay cá nhân và SME. Tiến hành làm sạch, chiết xuất các đặc trưng để phục vụ xây dựng mô hình. Bổ sung đặc trưng mới, khám phá các cách tiếp cận mới để nâng cao chất lượng mô hình Xây dựng pipeline để liên tục validate và tối ưu chất lượng mô hình Phân tích và diễn giải các mô hình với các bên liên quan\nA. Năng lực chuyên môn (ghi cụ thể tên Năng lực) Tốt nghiệp Đại học/học viện chuyên ngành Thống kê, Toán học, CNTT, Khoa học máy tính, Kỹ thuật phần mềm hoặc các lĩnh vực liên quan. Có ít nhất 3 năm kinh nghiệm thực tế về Khoa học dữ liệu Thành thạo Python, SQL (truy vấn dữ liệu tốt). Thành thạo Pandas, NumPy Hiểu rõ: Machine Learning (classification, regression, clustering...), Feature engineering, Model evaluation (precision,auc, gini) Có tư duy tốt về business risk B. Năng lực khác (ghi cụ thể kiến thức/hiểu biết, kỹ năng, phẩm chất,...) Tư duy logic, sáng tạo Chủ động trong công việc Chịu được áp lực tốt Kỹ năng làm việc độc lập, chịu được áp lực Ưu tiên ứng viên có nhiều kinh nghiệm xây dựng các mô hình mảng tài chính: credit scoring / risk model C. Những yếu tố khác (kinh nghiệm, chứng chỉ/chuyên ngành đào tạo/chứng chỉ,...) Tính đúng giờ, chuyên nghiệp Phong thái tham gia phỏng vấn Tính phù hợp với văn hóa và phối hơp trong bộ pận Sẵn sàng làm người khai phá, dẫn dắt","sp":"holdout","kp":true,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"Python","id":"SK0256","s":16,"e":22},{"n":"SQL","id":"SK0278","s":24,"e":27},{"n":"Machine Learning","id":"SK0195","s":29,"e":45},{"n":"Fraud Detection","id":"SK0143","s":103,"e":111},{"n":"Credit Scoring","id":"SK0069","s":1341,"e":1355},{"n":"Feature Engineering","id":"SK0137","s":989,"e":1008},{"n":"Model Evaluation","id":"SK0208","s":1010,"e":1026},{"n":"Pandas","id":"SK0238","s":904,"e":910},{"n":"NumPy","id":"SK0226","s":912,"e":917},{"n":"Regression","id":"SK0269","s":961,"e":971},{"n":"Clustering","id":"SK0063","s":973,"e":983}],"S":[{"k":"missing","a":"thêm","lv":"xem","n":"Risk Scoring","id":"SK0276","why":"«xây dựng các mô hình mảng tài chính: credit scoring / risk model» và «mô hình chấm điểm gian lận/tín nhiệm».","s":1358,"e":1368}]},{"id":"7dcb1cbbd869bfaf","src":"ITviec","t":"Database Expert (Oracle, MongoDB, SQL)","url":"https://itviec.com/it-jobs/database-expert-oracle-mongodb-sql-elca-1708","x":"Database Expert (Oracle, MongoDB, SQL)\nManage DB health and services to ensure the highest standards of availability, resilience, integrity, security, tuning, and performance, backups and recovery plans. Participate in transformation and architecture projects, related to AWS, OCI Cloud Execute disaster recovery plans and procedures to ensure database availability during system outages or dysfunction. Support development teams on database aspects. Join operations sessions with customers for live monitoring, troubleshooting, fine-tuning production database Monitor and resolve issues of both Production and Integration environments\nAt least 10 years experience in DB Administration (Oracle, MongoDB), performance tuning, and backup/recovery strategies. Strong knowledge of PL/SQL, SQL performance optimization, and Oracle database security best practices. Bachelor’s Degree in Computer Science, Telco, or related fields. Strong experience on MongoDB, Oracle, MySQL, Postgres, DB cloud platform (OCI, AWS). Strong experience on database optimization: PL/SQL, tuning, ETL, Data Warehousing. DB experience and hands on on Oracle Database, DR, DB peft optimization, backup, DB admin,... Excellent communication skills. Excellent self-learning skills, be able to self-research & propose solutions to database problems. Accurate, Organized, Detail oriented, Proactive, Caring, and Curious. Flexible shift working in big events or per requirement. Nice to have Strong with Oracle Cloud Infrastructure (OCI) and database as a service (DBaaS). Experience on IaC - Terraform, Ansible. Willingness to work on Shifts schedule.","sp":"tune","kp":false,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"Databases","id":"SK0107","s":344,"e":352},{"n":"Oracle Database","id":"SK0236","s":1123,"e":1138},{"n":"MongoDB","id":"SK0215","s":25,"e":32},{"n":"SQL","id":"SK0278","s":34,"e":37},{"n":"Query Optimization","id":"SK0257","s":785,"e":813},{"n":"MySQL","id":"SK0218","s":963,"e":968},{"n":"PostgreSQL","id":"SK0243","s":970,"e":978},{"n":"Cloud Computing","id":"SK0062","s":281,"e":286},{"n":"Amazon Web Services","id":"SK0018","s":272,"e":275},{"n":"ETL","id":"SK0128","s":1070,"e":1073},{"n":"Data Warehouse","id":"SK0102","s":1075,"e":1091},{"n":"Infrastructure as Code","id":"SK0165","s":1553,"e":1556},{"n":"Terraform","id":"SK0307","s":1559,"e":1568},{"n":"Monitoring","id":"SK0216","s":500,"e":510},{"n":"Data Security","id":"SK0097","s":826,"e":843}],"S":[]},{"id":"6ce5b573ec474ac8","src":"ITviec","t":"Junior Infrastructure & AI Engineer","url":"https://itviec.com/it-jobs/junior-infrastructure-ai-engineer-trek-2000-international-0115","x":"Junior Infrastructure & AI Engineer\nWe're hiring a junior engineer to help support our production infrastructure and grow into our AI/ML intelligence layer. You don't need to know everything on this list — we're looking for strong fundamentals, curiosity, and a willingness to learn from senior engineers on the harder items. What You'll Do: Support day-to-day deployment, monitoring, and troubleshooting of our production systems (servers, containers, databases, APIs) Help deploy and maintain web apps (Node.js/Python backends, React dashboards) behind Nginx with proper HTTPS/DNS setup Assist with database operations — queries, backups, and restores Grow into our AI/ML team: help build and monitor models for solar performance forecasting and anomaly detection, and support our LLM/AI agent tooling\nMust-haves — Infrastructure: Comfortable with basic Linux command line (navigation, permissions, logs, processes) Understands Docker & Docker Compose — can build/run containers and read a Compose file Basic SQL and an understanding of what backup/restore means Has deployed a simple app before (school/personal projects count) and understands DNS, HTTPS, and firewall basics conceptually Must-haves — AI/ML: Solid Python fundamentals Understands core ML concepts (train/test split, overfitting) and has touched PyTorch Genuine interest in forecasting, time-series, or LLM-based applications Comfortable calling and working with REST APIs Nice to have : Windows Server, Nginx/reverse proxy, SSL setup, MQTT, server monitoring tools (Grafana/Prometheus) XGBoost/LightGBM, local LLM tools (Ollama), RAG/vector databases, LangChain/LangGraph, AI agents","sp":"tune","kp":true,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"Machi r-epos-vietnam-3033","x":"Senior Java Software Engineer (Spring, Cloud, AI)\nDevelop and maintain clean, scalable, and reliable Java backend services Optimize system performance, reliability, and development workflows Identify workflow bottlenecks and leverage AI tools and automation to improve team productivity Define and promote AI usage standards and best practices across the engineering team Establish validation practices for AI-generated code to ensure quality and maintainability Build reusable AI playbooks, templates, and toolkits to scale effective practices across the team Develop and maintain unit tests and participate in code reviews to ensure code quality Collaborate with engineers and cross-functional teams to design and deliver new features Contribute to the evolution of microservices architecture , focusing on scalability, reliability, and maintainability Mentor and guide junior engineers, sharing technical knowledge and best practices\nBachelor’s degree in Computer Science / Information Technology / Software Development, or related fields At least 6 years of experience in Java Backend and Spring frameworks (Spring Boot, JUnit, etc) Solid experience with Cloud platforms (AWS, Azure, GCP) and cloud-based application development Experience with AI-assisted development, workflow automation, or AI tools is a must Good knowledge of Relational Databases, SQL, and ORM Strong understanding of OOP, data structures, design patterns, concurrency, and problem-solving Understanding of SDLC and software engineering best practices Good/Fluent English communication is mandatory Proactive, open-minded, and willing to challenge existing ways of working and drive continuous improvement","sp":"holdout","kp":false,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"Java","id":"SK0168","s":7,"e":11},{"n":"Microservices","id":"SK0200","s":768,"e":781},{"n":"Cloud Computing","id":"SK0062","s":39,"e":44},{"n":"Amazon Web Services","id":"SK0018","s":1176,"e":1179},{"n":"Microsoft Azure","id":"SK0201","s":1181,"e":1186},{"n":"Google Cloud Platform","id":"SK0154","s":1188,"e":1191},{"n":"Relational Databases","id":"SK0271","s":1335,"e":1355},{"n":"SQL","id":"SK0278","s":1357,"e":1360},{"n":"Object-Oriented Programming","id":"SK0229","s":1394,"e":1397}],"S":[{"k":"missing","a":"thêm","lv":"xem","n":"Automation Engineering","id":"SK0032","why":"«Experience with AI-assisted development, workflow automation, or AI tools is a must».","s":1274,"e":1293}]},{"id":"c46592f2dd01e203","src":"ITviec","t":"Data & AI Automation Intern (Customer Care Center)","url":"https://itviec.com/it-jobs/data-ai-automation-intern-customer-care-center-phu-hung-securities-phs-1613","x":"Data & AI Automation Intern (Customer Care Center)\nOVERVIEW We are looking for a tech-savvy Intern to act as a bridge between the Customer Care Center (CCC) and Product/IT teams. This role focuses on applying AI solutions, workflow automation, and building internal tools to enhance operational efficiency, improve SLA performance, and enable data-driven decision-making. RESPONSIBILITIES 1. AI & Workflow Automation Assist in building and optimizing automated workflows for CCC using tools such as n8n, AI, and chatbots Apply AI/chatbot solutions to improve customer service processes and operational efficiency 2. Data & Dashboard Collect, consolidate, and clean data from multiple sources (CRM, Customer Service, Sales) Develop and maintain operational dashboards (SLA, ticket volume, CSAT, productivity metrics) 3. CRM & Internal Tools Support CRM workflow optimization and enhancements Design and develop simple internal tools (dashboards, monitoring tools, mini CRM systems) Create wireframes or prototypes using tools like Figma 4. Business - Tech Coordination Translate business requirements from CCC into data logic, workflows, and functional specifications Coordinate with Product/IT teams during implementation, testing, and optimization\n3rd/4th-year students or fresh graduates in IT, Data, Business, or related fields Basic knowledge of data handling (Excel, SQL, or BI tools) Familiarity with automation tools (e.g., n8n) or willingness to learn Interest in AI, chatbots, and automation technologies Strong logical thinking and problem-solving skills Good communication skills, able to work with both business and technical teams English: Intermediate (reading and basic communication)","sp":"tune","kp":false,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"Automation Engineering","id":"SK0032","s":451,"e":470},{"n":"CRM","id":"SK0051","s":693,"e":696},{"n":"Dashboarding","id":"SK0076","s":756,"e":766},{"n":"Monitoring","id":"SK0216","s":945,"e":961},{"n":"Microsoft Excel","id":"SK0202","s":1365,"e":1370},{"n":"SQL","id":"SK0278","s":1372,"e":1375},{"n":"Business Intelligence","id":"SK0046","s":380,"e":382}],"S":[{"k":"label","a":"sửa bằng chứng","lv":"cao","n":"Business Intelligence","id":"SK0046","why":"Bằng chứng trỏ vào «BI» bên trong chữ «RESPONSIBILITIES»; bằng chứng đúng là «BI tools» trong «(Excel, SQL, or BI tools)».","s":1380,"e":1382,"li":6}]},{"id":"9ed290d237fb4015","src":"ITviec","t":"Software Engineer (AI Coding Agent/.Net/Java)","url":"https://itviec.com/it-jobs/software-engineer-ai-coding-agent-net-java-ol-vietnam-2103","x":"Software Engineer (AI Coding Agent/.Net/Java)\nYou will have the opportunity to focus on the aspects of the job that you enjoy the most. Specifically, you will: Developing scalable new features for our software product that exceeds our customer’s needs. Building architecture for our platform to ensure optimal performance. Obtaining requirement feedback from internal teams/clients to maintain/support the product development. Write the Unit Tests for robust development. Performing code reviews on other team members’ work. Taking ownership of projects and having the opportunity to further your knowledge Taking control over your productivity and improving your time management and communication skills\nThe most successful candidates for this role will have: Candidates must demonstrate the ability to use AI coding agents to perform feature-level or bugfix-level work across a codebase, including context preparation, agent direction, implementation review, testing, and PR-quality delivery. Proficiency with any backend programming languages. Proficiency in English (both verbal and written). At least 3 years practical experience on a web-based application. A solid fundamental understanding of software development. An understanding of complex algorithms and data structures, as well as a passion for intellectual challenges. Strong self-discipline for delivering well-tested, complete features/modules under a tight schedule and the capability for rational thinking. Experience with the database management tool SQL is a plus, but not mandatory. Experience with C#, .Net could be a plus, but not mandatory. A Bachelor’s Degree in any relevant major (e.g. Information Technology, Computer Science, etc.).","sp":"holdout","kp":false,"note":"System Architecture ánh xạ từ tác vụ xây kiến trúc; cần rà soát mức độ cụ thể.","L":[{"n":"AI Agents","id":"SK0003","s":808,"e":824},{"n":"Java","id":"SK0168","s":40,"e":44},{"n":"SQL","id":"SK0278","s":1519,"e":1522},{"n":"C#","id":"SK0048","s":1569,"e":1571},{"n":"System Architecture","id":"SK0303","s":253,"e":291}],"S":[{"k":"label","a":"xem","lv":"xem","n":"System Architecture","id":"SK0303","why":"«Building architecture for our platform» — nhiệm vụ chung; Codex cũng ghi chú cần rà soát.","li":4}]},{"id":"95f2b91d4a8da423","src":"ITviec","t":"Database Administrator (OracleDB, MS SQL, PostgreSQL)","url":"https://itviec.com/it-jobs/database-administrator-oracledb-ms-sql-postgresql-swisslog-vietnam-2215","x":"Database Administrator (OracleDB, MS SQL, PostgreSQL)\nAs a Database Administrator at Swisslog, your key responsibilities are: Project activities: Installation, troubleshooting and configuration of databases on Unix/Linux and MS Windows platform. Installation and configuration Application servers (Weblogic, Wildfly, JBoss) Installation of system upgrades (patching) on customer systems (Remote or Onsite) Configurating and ensuring high availability of database systems (data guard) Data migration from an older DB version to newer version Developing and enhancing the backup & restore strategy Document changes in the change log and asset management database Support activities: Standby support 24x7, up to 2 weeks/month Independent problem analysis e.g., slowness and troubleshooting incident/problem. Conduct regular database checks and provide a report including recommendation. Adhere to Swisslog processes.\nYour skills and experience: Degree in information technology, computer science or equivalent. Minimum 5 years of working experience as a Database Administrator with one of the; following Database: Oracle DB, MS SQL, PostgreSQL. Expertise in the development of scripts (SQL, Shell, PL/SQL). Expertise in the following application servers: Weblogic, Wildfly and JBoss. Proficient in English with strong writing and speaking skills. Ability to collaborate across teams and departments. Proactive and team player mindset and reliability. Ability to work independently and customer oriented. Good communication skills, flexibility, and willingness to travel abroad. Independent and customer-oriented behavior as well as a high willingness to learn. Working Domains: Technical: OracleDB, MS SQL, PostgreSQL Business: Intralogistics All interviews are preferred to be done in English.","sp":"tune","kp":true,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"Databases","id":"SK0107","s":197,"e":206},{"n":"Oracle Database","id":"SK0236","s":1111,"e":1120},{"n":"Microsoft SQL Server","id":"SK0203","s":34,"e":40},{"n":"PostgreSQL","id":"SK0243","s":42,"e":52},{"n":"SQL","id":"SK0278","s":37,"e":40},{"n":"Linux/Unix Shell","id":"SK0183","s":1188,"e":1193}],"S":[{"k":"label","a":"sửa bằng chứng","lv":"cao","n":"SQL","id":"SK0278","why":"Bằng chứng trỏ vào «SQL» trong «MS SQL» (tên sản phẩm); bằng chứng đúng là «scripts (SQL, Shell, PL/SQL)».","s":1183,"e":1186,"li":4}]},{"id":"445de392e42f35bf","src":"ITviec","t":"Data Governance Manager","url":"https://itviec.com/it-jobs/data-governance-manager-onpoint-2121","x":"Data Governance Manager\nThis role sets up data governance as a company-wide function — so every number we report, internally, to brand partners, and to investors, has one definition, one owner, and one source of truth. Key Responsibilities Own the data governance policy, classification framework, and data standards. Own the glossary and the shared definitions process — and settle disagreements between teams. Lead the Master Data team and build one trusted record for each brand partner, product, channel, and location. Set up clear processes for requesting, approving, and reviewing data changes. Build the network of Data Owners and Data Stewards across functions (Finance, Commercial, Operations, and SoCom) Set data quality standards and response targets and publish monthly scorecards. Work with Tech to automate data checks, syncing, and other repetitive tasks. Own data access requests and reviews, working with Tech, Data & AI head on technical setup, and build governance into the move to Databricks. Run the Data Governance Council and keep a record of decisions.\nBachelor’s degree or higher in Information Technology, Management Information Systems (MIS), Computer Science, Data Science, Statistics, Business Administration, or a related field. 5 to 8 years of experience in data governance, data management, or analytics, with real ownership of a program. Experience building a glossary, a master data program, or a data quality program across multiple teams. Proven ability to hold senior leaders accountable, without having formal authority over them — this matters more than technical depth. Comfortable working with data and cloud systems; experience with Databricks is a strong plus. Experience with retail, e-commerce, or marketplace data is a strong plus. Experience managing people. Fluent in English; Vietnamese is a plus.","sp":"tune","kp":false,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"Data Governance","id":"SK0082","s":42,"e":57},{"n":"Data Quality","id":"SK0094","s":718,"e":730},{"n":"Data Management","id":"SK0087","s":1306,"e":1321},{"n":"Databricks","id":"SK0108","s":1001,"e":1011},{"n":"Cloud Computing","id":"SK0062","s":1644,"e":1657},{"n":"Data Validation","id":"SK0099","s":821,"e":832}],"S":[{"k":"missing","a":"thêm","lv":"xem","n":"Data Catalog","id":"SK0080","why":"«Own the glossary and the shared definitions process», «building a glossary» — business glossary thuộc nhóm data catalog.","s":326,"e":334},{"k":"missing","a":"thêm","lv":"xem","n":"Data Analysis","id":"SK0078","why":"«experience in data governance, data management, or analytics».","s":1326,"e":1335}]},{"id":"01d7a5e0eef13063","src":"ITviec","t":"Chuyên gia Sản phẩm AI (AI Product Expert)","url":"https://itviec.com/it-jobs/chuyen-gia-san-pham-ai-ai-product-expert-hdbank-5317","x":"Chuyên gia Sản phẩm AI (AI Product Expert)\n1. Xây dựng và dẫn dắt chiến lược ứng dụng AI/GenAI trong Ngân hàng nhằm nâng cao năng suất vận hành, trải nghiệm khách hàng và tăng trưởng doanh thu. 2. Theo dõi xu hướng AI, GenAI, Agentic AI và đề xuất sáng kiến đổi mới tạo lợi thế cạnh tranh. 3. Dẫn dắt toàn bộ vòng đời sản phẩm AI (ý tưởng → POC → triển khai → đo lường & cải tiến). 4. Đánh giá, lựa chọn và đề xuất công cụ, nền tảng và đối tác AI phù hợp. 5. Bảo đảm sản phẩm AI tuân thủ quy định về bảo vệ dữ liệu cá nhân, an toàn thông tin và các quy định ngành; phối hợp các tuyến kiểm soát khi cần. 6. Chia sẻ tri thức, hướng dẫn và nâng cao năng lực ứng dụng AI cho các đơn vị; lan toả và góp phần xây dựng văn hoá đổi mới sáng tạo. 7. Theo dõi, đo lường, đánh giá và báo cáo sau triển khai AI dựa trên cơ sở dữ liệu. 8. Thực hiện các nhiệm vụ khác theo phân công của Cấp quản lý.\n1. Tốt nghiệp Đại học trở lên trong các chuyên ngành như: Công nghệ thông tin, Khoa học máy tính, Khoa học dữ liệu, Trí tuệ nhân tạo, Kinh tế, Tài chính – Ngân hàng, Quản trị kinh doanh hoặc lĩnh vực liên quan. 2. Ưu tiên ứng viên có các chứng chỉ về AI. 3. Trên 5 năm kinh nghiệm trong lĩnh vực ngân hàng/tài chính ở vai trò sản phẩm hoặc vận hành; hiểu quy trình nghiệp vụ ngân hàng (tín dụng bán lẻ, thanh toán, bán hàng, vận hành). 4. Ít nhất 3 năm trực tiếp phát triển hoặc quản lý sản phẩm AI/GenAI. 5. Đã trực tiếp đưa tối thiểu một sản phẩm/ứng dụng AI vào vận hành thực tế (end-to-end). 6. Có năng lực phát triển sản phẩm AI và có kinh nghệm về GenAI/LLM, RAG, tự động hoá quy trình; hiểu rõ khả năng và giới hạn của AI. 7. Có kiến thức về chuyển đổi số và ứng dụng AI trong lĩnh vực ngân hàng, tài chính. 8. Quen thuộc các nền tảng xây dựng ứng dụng LLM (RAG, Agent, Dify/LangChain...) và công cụ dữ liệu/BI (Power BI); hiểu bối cảnh pháp lý NHNN/SBV.","sp":"tune","kp":false,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"Generative AI","id":"SK0146","s":89,"e":94},{"n":"Agentic AI","id":"SK0010","s":226,"e":236},{"n":"Large Language Models","id":"SK0179","s":1546,"e":1549},{"n":"Retrieval-Augmented Generation","id":"SK0273","s":1551,"e":1554},{"n":"AI Agents","id":"SK0003","s":226,"e":231},{"n":"LangChain","id":"SK0177","s":1768,"e":1777},{"n":"Power BI","id":"SK0244","s":1805,"e":1813},{"n":"Business Intelligence","id":"SK0046","s":1801,"e":1803},{"n":"Automation Engineering","id":"SK0032","s":1556,"e":1577}],"S":[{"k":"label","a":"sửa bằng chứng","lv":"cao","n":"AI Agents","id":"SK0003","why":"Bằng chứng đang là chữ «Agent» bên trong «Agentic AI»; bằng chứng riêng của AI Agents là «Agent» trong «(RAG, Agent, Dify/LangChain...)».","s":1756,"e":1761,"li":4},{"k":"missing","a":"thêm","lv":"xem","n":"Data Security","id":"SK0097","why":"«Bảo đảm sản phẩm AI tuân thủ quy định về bảo vệ dữ liệu cá nhân, an toàn thông tin» — có thể chỉ là tuân thủ chung (§12.2).","s":500,"e":522}]},{"id":"725751e20e05f952","src":"ITviec","t":"AI Engineer Intern","url":"https://itviec.com/it-jobs/ai-engineer-intern-8seneca-3514","x":"AI Engineer Intern\nAs an AI Engineer Intern, you will contribute to the design, development, and deployment of AI-driven systems and backend services. You’ll collaborate closely with AI specialists, data engineers, and software developers to build intelligent applications and scalable APIs. This role offers hands-on experience with modern AI frameworks, backend technologies, and web integration. Responsibilities: Collaborate with cross-functional teams to design, develop, and deploy AI and backend solutions using Python and FastAPI. Support data preprocessing, analysis, and integration tasks for AI models. Implement, test, and optimize machine learning (ML) and large language model (LLM) applications. Work with databases - write queries, manage data, and integrate using SQL and MongoDB. Develop APIs and services that communicate through HTTP or WebSocket protocols. Collaborate on building AI-enabled web features; ReactJS knowledge is a plus. Document technical workflows, APIs, and development progress. Participate in testing and performance tuning to ensure reliability and scalability.\nRequirements: Bachelor’s degree in Computer Science, Engineering, or related field. Solid understanding of AI concepts and machine learning fundamentals, with a good ML foundation. Having basic knowledge of NLP (Natural Language Processing) and Computer Vision is an advantage. Basic knowledge of LLM (Large Language Model) concepts and applications. Experience working with FastAPI or similar backend frameworks. Basic experience with SQL and MongoDB for data management. Understanding of WebSocket or HTTP-based API communication. Strong problem-solving, collaboration, and English communication skills. What We Offer: Allowance: 3,000,000 VND/month Opportunity to become a full-time employee after 6 months A collaborative, dynamic, and supportive work environment Hands-on experience in AI development, backend systems, and LLM applications","sp":"tune","kp":true,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"Python","id":"SK0256","s":519,"e":525},{"n":"FastAPI","id":"SK0136","s":530,"e":537},{"n":"Machine Learning","id":"SK0195","s":644,"e":660},{"n":"Large Language Models","id":"SK0179","s":670,"e":690},{"n":"Databases","id":"SK0107","s":721,"e":730},{"n":"SQL","id":"SK0278","s":781,"e":784},{"n":"MongoDB","id":"SK0215","s":789,"e":796},{"n":"Natural Language Processing","id":"SK0220","s":1315,"e":1342},{"n":"Computer Vision","id":"SK0066","s":1348,"e":1363},{"n":"Data Management","id":"SK0087","s":1559,"e":1574},{"n":"Data Analysis","id":"SK0078","s":567,"e":575}],"S":[{"k":"missing","a":"thêm","lv":"cao","n":"API Design","id":"SK0004","why":"«build intelligent applications and scalable APIs», «Develop APIs and services that communicate through HTTP or WebSocket».","s":798,"e":823,"auto":"add","autoWhy":"Quy ước 05/11 (Cường): tin nhắc tới xây dựng, tích hợp hoặc làm việc với API (REST, RESTful, SOAP, GraphQL…) thì gán API Design."},{"k":"missing","a":"thêm","lv":"xem","n":"Model Deployment","id":"SK0206","why":"«design, develop, and deploy AI and backend solutions».","s":481,"e":512}]},{"id":"c22258de8eeae159","src":"ITviec","t":"Intern AI / Python Engineering (Japanese at least N4)","url":"https://itviec.com/it-jobs/intern-ai-python-engineering-japanese-at-least-n4-ivc-isb-vietnam-2044","x":"Intern AI / Python Engineering (Japanese at least N4)\nWrite clean, readable, and maintainable Python code to build scripts, REST APIs, and data processing utilities. Assist in integrating AI/ML models and services (e.g., OpenAI API, Hugging Face, LangChain, or custom models) into existing applications and microservices. Help build, test, and optimize data extraction, transformation, and ingestion pipelines (ETL/ELT) for AI workflows. Write unit and integration tests (using pytest or similar) to ensure the reliability and performance of AI features and data feeds. Conduct fast-paced research and experiments with open-source AI tools, libraries, and prompt engineering strategies to solve specific technical problems. Participate in agile team ceremonies (standups, code reviews) and maintain clear technical documentation for tools and APIs developed during the internship.\nCurrently pursuing or recently completed a Bachelor’s in Computer Science, Data Science, Software Engineering, or a related quantitative field. Strong foundation in core Python programming (data structures, OOP, file handling, async concepts, standard libraries). Practical coursework or project experience with machine learning concepts, NLP, or modern AI tools (e.g., NumPy, Pandas, Scikit-learn, PyTorch, TensorFlow, or LLM APIs). Basic understanding of building or consuming RESTful APIs using frameworks like FastAPI or Flask . Familiarity with Git and GitHub/GitLab for code versioning and pull requests. Strong analytical skills, curiosity about emerging AI technologies, and a self-driven willingness to learn. Japanese at least N4 Nice-to-Haves (Bonus) Experience with Apache Kafka, LlamaIndex, Ollama, and sensors. Experience with Docker, Kubernetes, and managing multi-database container setups. Knowledge of cloud platforms (AWS, GCP, or Azure) and CI/CD pipelines. Understanding of system profiling, profiling memory leaks in Python, and API benchmarking.","sp":"holdout","kp":true,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"Python","id":"SK0256","s":12,"e":18},{"n":"Machine Learning","id":"SK0195","s":191,"e":193},{"n":"OpenAI API","id":"SK0231","s":221,"e":231},{"n":"LangChain","id":"SK0177","s":247,"e":256},{"n":"Microservices","id":"SK0200","s":307,"e":320},{"n":"Data Pipelines","id":"SK0093","s":400,"e":409},{"n":"ETL","id":"SK0128","s":411,"e":414},{"n":"ELT","id":"SK0127","s":415,"e":418},{"n":"Prompt Engineering","id":"SK0250","s":656,"e":674},{"n":"Object-Oriented Programming","id":"SK0229","s":1088,"e":1091},{"n":"Asynchronous Programming","id":"SK0029","s":1108,"e":1113},{"n":"Natural Language Processing","id":"SK0220","s":1220,"e":1223},{"n":"NumPy","id":"SK0226","s":1251,"e":1256},{"n":"Pandas","id":"SK0238","s":1258,"e":1264},{"n":"scikit-learn","id":"SK0327","s":1266,"e":1278},{"n":"PyTorch","id":"SK0254","s":1280,"e":1287},{"n":"TensorFlow","id":"SK0305","s":1289,"e":1299},{"n":"Large Language Models","id":"SK0179","s":1304,"e":1307},{"n":"FastAPI","id":"SK0136","s":1395,"e":1402},{"n":"Flask","id":"SK0141","s":1406,"e":1411},{"n":"Git","id":"SK0149","s":1431,"e":1434},{"n":"Apache Kafka","id":"SK0027","s":1659,"e":1671},{"n":"Docker","id":"SK0125","s":1722,"e":1728},{"n":"Kubernetes","id":"SK0175","s":1730,"e":1740},{"n":"Databases","id":"SK0107","s":1755,"e":1769},{"n":"Cloud Computing","id":"SK0062","s":1801,"e":1816},{"n":"Amazon Web Services","id":"SK0018","s":1818,"e":1821},{"n":"Google Cloud Platform","id":"SK0154","s":1823,"e":1826},{"n":"Microsoft Azure","id":"SK0201","s":1831,"e":1836},{"n":"CI/CD","id":"SK0050","s":1842,"e":1847}],"S":[{"k":"missing","a":"thêm","lv":"cao","n":"API Design","id":"SK0004","why":"«build scripts, REST APIs, and data processing utilities», «building or consuming RESTful APIs».","s":124,"e":133,"auto":"add","autoWhy":"Quy ước 05/11 (Cường): tin nhắc tới xây dựng, tích hợp hoặc làm việc với API (REST, RESTful, SOAP, GraphQL…) thì gán API Design."}]},{"id":"9af31f46c459ae43","src":"ITviec","t":"Database Administrator Developer (DBA)","url":"https://itviec.com/it-jobs/database-administrator-developer-dba-ngan-hang-thuong-mai-tnhh-mtv-ky-nguyen-thinh-vuong-gpbank-3627","x":"Database Administrator Developer (DBA)\nTư vấn, đề xuất và triển khai mô hình quản trị và vận hành cơ sở dữ liệu tuân thủ tiêu chuẩn của tổ chức và quy định của Ngân hàng Nhà nước Việt Nam (SBV). Giám sát hiệu năng, tính khả dụng và mức độ sử dụng dung lượng của cơ sở dữ liệu; tối ưu hóa truy vấn và tài nguyên hệ thống. Thiết lập và vận hành cơ chế sao lưu (backup), khôi phục (restore) và khắc phục thảm họa (disaster recovery - DR) nhằm đảm bảo an toàn dữ liệu và khả năng khôi phục kịp thời. Quản trị phân quyền truy cập, mã hóa dữ liệu và triển khai các biện pháp bảo mật cơ sở dữ liệu tuân thủ chính sách nội bộ và tiêu chuẩn quy định (như GDPR, ISO 27001). Phối hợp với các đội phát triển, tích hợp và phân tích dữ liệu để tối ưu hóa cấu trúc và hiệu năng cơ sở dữ liệu. Vận hành và duy trì cơ chế tính sẵn sàng cao (high-availability) và nhân bản dữ liệu (replication), bao gồm Clustering, AlwaysOn, Data Guard, Log Shipping và các cơ chế khác. Xây dựng và duy trì tài liệu kỹ thuật, bao gồm sơ đồ kiến trúc cơ sở dữ liệu, hướng dẫn khôi phục, quy trình bảo trì và Quy trình vận hành chuẩn (SOP). Tham gia các dự án triển khai hạ tầng, chuyển đổi dữ liệu (data migration) và di chuyển lên nền tảng đám mây (cloud migration) khi có yêu cầu.\nTốt nghiệp Cử nhân hoặc Thạc sĩ trở lên chuyên ngành: Công nghệ thông tin, Khoa học máy tính, Khoa học dữ liệu, Toán – Tin, Hệ thống thông tin, Kinh tế lượng/Thống kê, Tài chính/Ngân hàng hoặc các chuyên ngành liên quan. Có từ 2–5 năm kinh nghiệm trong các vai trò như: DBA, DBA Developer, Data Engine hoặc tương đương. Hiểu biết cơ bản về các thành phần trong hệ sinh thái dữ liệu, công nghệ: Database, DevOps, Developer, hoặc tối ưu CSDL với workload lớn trong mảng Banking, FinTech. Ưu tiên ứng viên có kinh nghiệm làm việc với các hệ thống CSDL lớn trong lĩnh vực ngân hàng. Ưu tiên ứng viên có kinh nghiệm làm việc với hệ quản trị CSDL (SQL Server, Oracle, PostgreSQL) hoặc các hệ thống CoreBanking (T24, FLEXCUBE...).","sp":"holdout","kp":false,"note":"Clustering trong HA database không được coi là kỹ thuật clustering của ML.","L":[{"n":"Databases","id":"SK0107","s":98,"e":111},{"n":"Monitoring","id":"SK0216","s":195,"e":213},{"n":"Query Optimization","id":"SK0257","s":277,"e":296},{"n":"Data Security","id":"SK0097","s":569,"e":590},{"n":"Cloud Computing","id":"SK0062","s":1206,"e":1213},{"n":"DevOps","id":"SK0118","s":1652,"e":1658},{"n":"Microsoft SQL Server","id":"SK0203","s":1890,"e":1900},{"n":"Oracle Database","id":"SK0236","s":1902,"e":1908},{"n":"PostgreSQL","id":"SK0243","s":1910,"e":1920}],"S":[{"k":"label","a":"xem","lv":"xem","n":"DevOps","id":"SK0118","why":"«hiểu biết cơ bản về ... Database, DevOps, Developer» — nhắc như thành phần hệ sinh thái, mức yêu cầu thấp.","li":5},{"k":"missing","a":"thêm","lv":"xem","n":"Data Architecture","id":"SK0079","why":"«Xây dựng và duy trì tài liệu kỹ thuật, bao gồm sơ đồ kiến trúc cơ sở dữ liệu».","s":1000,"e":1029}]},{"id":"64a6ef8c17d8b382","src":"ITviec","t":"AI Engineer (Remote)","url":"https://itviec.com/it-jobs/ai-engineer-remote-alpha-bravo-development-4157","x":"AI Engineer (Remote)\nAbout Alpha Bravo Development Alpha Bravo Development is a fast-growing US-based software development agency specializing in fully custom software solutions for service-based businesses. We help clients develop centralized platforms that match each client’s unique workflow, giving them full ownership, customization, and long-term cost efficiency. With a strong reputation for quality, reliability, and innovation, we're expanding our global footprint and building an elite development team in Vietnam to help drive our next phase of growth. Overview We are looking for a skilled and motivated AI Engineer to join our Vietnam engineering team. You will collaborate closely with our US and international teams to build and integrate AI-powered features and solutions that support our web and mobile applications. This role is ideal for someone who is interested in AI, automation, and modern software development, enjoys solving practical problems, and is eager to contribute to a growing global product team.\nRequirements 2+ years of experience in software development, AI/ML, or a related field. Good programming skills in Python. Hands-on experience working with AI/ML or Generative AI applications. Familiarity with LLMs and AI APIs such as OpenAI, Claude, Gemini, or similar. Basic understanding or hands-on experience with RAG, embeddings, vector databases, or prompt engineering is a plus. Experience working with APIs and backend services. Familiarity with Git and common software development practices. Basic understanding of databases. Good English communication skills, especially for working with US-based teams. Strong problem-solving skills and willingness to learn new technologies. Nice to Have Experience with AI agent frameworks or AI automation. Experience with cloud platforms such as AWS, GCP, or Azure. Experience with LangChain, LlamaIndex, or similar AI frameworks. Experience integrating AI features into existing web/mobile applications.","sp":"holdout","kp":false,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"Machine Learning","id":"SK0195","s":1095,"e":1097},{"n":"Python","id":"SK0256","s":1146,"e":1152},{"n":"Generative AI","id":"SK0146","s":1196,"e":1209},{"n":"Large Language Models","id":"SK0179","s":1241,"e":1245},{"n":"OpenAI API","id":"SK0231","s":1266,"e":1272},{"n":"Claude","id":"SK0059","s":1274,"e":1280},{"n":"Gemini","id":"SK0145","s":1282,"e":1288},{"n":"Retrieval-Augmented Generation","id":"SK0273","s":1350,"e":1353},{"n":"Embeddings","id":"SK0130","s":1355,"e":1365},{"n":"Vector Database","id":"SK0317","s":1367,"e":1383},{"n":"Prompt Engineering","id":"SK0250","s":1388,"e":1406},{"n":"Git","id":"SK0149","s":1486,"e":1489},{"n":"Databases","id":"SK0107","s":1374,"e":1383},{"n":"AI Agents","id":"SK0003","s":1748,"e":1756},{"n":"Cloud Computing","id":"SK0062","s":1802,"e":1817},{"n":"Amazon Web Services","id":"SK0018","s":1826,"e":1829},{"n":"Google Cloud Platform","id":"SK0154","s":1831,"e":1834},{"n":"Microsoft Azure","id":"SK0201","s":1839,"e":1844},{"n":"LangChain","id":"SK0177","s":1862,"e":1871}],"S":[{"k":"label","a":"sửa bằng chứng","lv":"cao","n":"Databases","id":"SK0107","why":"Bằng chứng trỏ vào «databases» trong «vector databases»; bằng chứng đúng là «Basic understanding of databases».","s":1556,"e":1565,"li":12},{"k":"missing","a":"thêm","lv":"xem","n":"Automation Engineering","id":"SK0032","why":"«Experience with AI agent frameworks or AI automation».","s":1771,"e":1784},{"k":"missing","a":"thêm","lv":"xem","n":"API Design","id":"SK0004","why":"«Experience working with APIs and backend services».","s":1442,"e":1467,"auto":"add","autoWhy":"Quy ước 05/11 (Cường): tin nhắc tới xây dựng, tích hợp hoặc làm việc với API (REST, RESTful, SOAP, GraphQL…) thì gán API Design."}]},{"id":"29ab50006770f2f6","src":"ITviec","t":"Principal AI-native Full-stack Software Engineer","url":"https://itviec.com/it-jobs/principal-ai-native-full-stack-software-engineer-koidra-tech-4010","x":"Principal AI-native Full-stack Software Engineer\n🚀 The Mission Koidra isn't just building software; we are building the brain for industrial automation . We are looking for a Principal AI-Native Software Engineer to build software together with the CEO. You will orchestrate the AI agents that write the code in conjunction with your hand-crafted code. Your work will enable our team to remain lean, hyper-efficient, and focused on our core DNA: Autonomous Physical Agents . 🛠️ What You Will Do Orchestrate AI agents: You will guide and architect senior-level AI agents (via Claude Code++) that generate safe, bug-free, and high-performance code at scale. Master the Deep Stack: You will own the architecture of our end-to-end stack. Push the State of the Art: You will constantly keep Koidra’s engineering velocity 10x higher than industry standards. Force-Multiply the Team: You will enable our domain experts (physicists, agronomists, control engineers) to ship production-grade software by giving them AI-powered tools that translate their math into robust code.\nAI-native Software Engineering : You have 5+ years of deep software engineering experience, but you have spent the last year obsessed with Agentic AI for coding. You know the difference between a “lazy prompt” and a “robust system spec” that produces solid code. Paranoid about Safety: You understand that “hallucination” in a chatbot is annoying, but hallucination in an industrial control system is catastrophic. You know how to build verification loops, property-based tests, and static analysis gates that catch AI errors before they merge. Polyglot Master: You are comfortable auditing code in Python, Rust, and TypeScript. You don't need to write every line, but you must be able to judge the quality of the AI’s output in any of these languages. Systems Thinker: You care about the “why” and the “how”. You can explain the whys and whys not of the engineering decisions, whether made by yourself or your AI agents, to both the CEO and other engineers.","sp":"tune","kp":false,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"AI Agents","id":"SK0003","s":279,"e":288},{"n":"Claude Code","id":"SK0060","s":575,"e":586},{"n":"Agentic AI","id":"SK0010","s":1206,"e":1216},{"n":"Python","id":"SK0256","s":1666,"e":1672},{"n":"TypeScript","id":"SK0314","s":1684,"e":1694}],"S":[{"k":"missing","a":"thêm","lv":"xem","n":"Prompt Engineering","id":"SK0250","why":"«You know the difference between a “lazy prompt” and a “robust system spec”».","s":1264,"e":1275}]},{"id":"c9d04b5245da809a","src":"ITviec","t":"Business Analyst — AI Solutions (Agile, Figma, BRD/FRD)","url":"https://itviec.com/it-jobs/business-analyst-ai-solutions-agile-figma-brd-frd-cong-ty-co-phan-dich-vu-ky-thuat-lnd-4819","x":"Business Analyst — AI Solutions (Agile, Figma, BRD/FRD)\nROLE SUMMARY: Bridge end-users and the AI build team. Own requirements, act as the primary user-facing interface for LND’s AI initiative, run training, and lead QA / UAT before each deployment — operating inside the team’s cadence of shipping a usable increment every ≤ 2 weeks. This role fills two gaps flagged in the AI Team Build Recommendations: an unassigned QA / Tester function and the need to protect the Product Owner’s time before each sprint. KEY RESPONSIBILITIES: User interface & discovery. Run workshops and interviews with stakeholders (execution, proposal, field service, BoD), capture pain points and translate them into AI-solution concepts. Requirements & documentation. Produce BRD / FRD, user stories, use cases, workflow diagrams and UAT scenarios with clear acceptance criteria. Rapid prototyping & mock-ups. Turn requirements into clickable Figma mock-ups and AI-generated prototypes, iterating fast with users to validate before build. QA & testing. Prepare test cases and datasets, perform internal business testing and coordinate UAT before hand-over — owning the currently-unassigned QA role. Business Analyst — AI Solutions Deliver training and user manuals, support deployment, then log bugs / change requests and prioritise them with the Product Owner.\nBachelor’s degree in IT, Information Systems or Business; 2–4 years as an (IT) Business Analyst in software delivery. Solid grasp of SDLC + Agile / Scrum and requirement-elicitation techniques. Hands-on experience writing BRD / FRD, user stories, acceptance criteria, and supporting UAT. Mock-up & wireframing using Figma and AI-assisted mock-up / design tools to produce interface mock-ups quickly. AI prototyping - fluent with AI rapid-prototyping methodologies to move from concept to working demo fast. Proven track record of end-user training and documentation. Strong English + Vietnamese communication - customer-facing, both languages. SQL / basic data analysis for validation and reporting.","sp":"tune","kp":false,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"SQL","id":"SK0278","s":1984,"e":1987},{"n":"Data Analysis","id":"SK0078","s":1996,"e":2009},{"n":"Data Validation","id":"SK0099","s":2014,"e":2024},{"n":"Reporting","id":"SK0272","s":2029,"e":2038}],"S":[{"k":"label","a":"xem","lv":"xem","n":"Data Validation","id":"SK0099","why":"«SQL / basic data analysis for validation and reporting» — validation ở đây là kiểm tra nghiệp vụ, chưa rõ là data validation.","li":2}]},{"id":"1984cf81f948a723","src":"ITviec","t":"AI Engineer","url":"https://itviec.com/it-jobs/ai-engineer-one-mount-group-0131","x":"AI Engineer\nABOUT ONE MOUNT One Mount is Vietnam’s largest technological ecosystem that creates solutions along the entire value chain, starting with retail, distribution, real estate, and financial services. Our mission is to build Vietnam’s most trusted ecosystem, empowering all people and businesses to realize their full potential at the intersection of technology and humanity. MAIN RESPONSIBILITIES We are seeking highly skilled AI Engineers to enhance our product team. This position focuses on developing and implementing AI and data solutions within the real estate domain. Build Data Pipelines: You'll directly build pipelines for collecting, processing, and standardizing real estate data (listings, transactions, legal documents, images, maps, etc.). Develop Automated Valuation Models (AVM): Develop real estate valuation models based on big data. Optimize Search & Recommendation Engines: Enhance search and product recommendation tools using Recommendation Systems and NLP (Natural Language Processing) algorithms. Integrate AI into Products: Collaborate with software architects, GIS, backend, and product teams to integrate AI models into real-world products. Implement & Improve ML Ops: Deploy, monitor, and continuously improve machine learning models in a production environment (ML Ops)\nGraduated with a degree in Computer Science, Mathematics, AI, or equivalent fields. Minimum of 3-4 years of practical experience in deploying ML/AI models. Proficient in Python and related libraries: Pandas, Scikit-learn, XGBoost, PyTorch/TensorFlow. Experienced with ETL systems, crawling, and big data processing. Familiar with database systems as SQL & NoSQL (PostgreSQL, MongoDB, Elastic, BigQuery...). Experience API-izing models and deploying machine learning models to the Cloud (GCP/AWS preferred). Experience in PropTech, FinTech, AdTech platforms or data-driven products. Knowledge of real estate, finance, investment, or online user behavior. Logical thinking, ability to work in a fast-paced environment, and not afraid to experiment.","sp":"tune","kp":true,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"Data Pipelines","id":"SK0093","s":590,"e":604},{"n":"Big Data","id":"SK0043","s":852,"e":860},{"n":"Recommendation Systems","id":"SK0265","s":958,"e":980},{"n":"Natural Language Processing","id":"SK0220","s":990,"e":1017},{"n":"MLOps","id":"SK0193","s":1198,"e":1204},{"n":"Machine Learning","id":"SK0195","s":1248,"e":1264},{"n":"Model Deployment","id":"SK0206","s":1748,"e":1781},{"n":"Python","id":"SK0256","s":1479,"e":1485},{"n":"Pandas","id":"SK0238","s":1509,"e":1515},{"n":"scikit-learn","id":"SK0327","s":1517,"e":1529},{"n":"PyTorch","id":"SK0254","s":1540,"e":1547},{"n":"TensorFlow","id":"SK0305","s":1548,"e":1558},{"n":"ETL","id":"SK0128","s":1577,"e":1580},{"n":"Databases","id":"SK0107","s":1639,"e":1655},{"n":"SQL","id":"SK0278","s":1659,"e":1662},{"n":"PostgreSQL","id":"SK0243","s":1672,"e":1682},{"n":"MongoDB","id":"SK0215","s":1684,"e":1691},{"n":"BigQuery","id":"SK0044","s":1702,"e":1710},{"n":"Cloud Computing","id":"SK0062","s":1789,"e":1794},{"n":"Google Cloud Platform","id":"SK0154","s":1796,"e":1799},{"n":"Amazon Web Services","id":"SK0018","s":1800,"e":1803}],"S":[{"k":"missing","a":"thêm","lv":"cao","n":"Elasticsearch","id":"SK0129","why":"«database systems as SQL & NoSQL (PostgreSQL, MongoDB, Elastic, BigQuery...)».","s":1693,"e":1700},{"k":"missing","a":"thêm","lv":"cao","n":"Model Monitoring","id":"SK0210","why":"«Deploy, monitor, and continuously improve machine learning models in a production environment».","s":1214,"e":1221},{"k":"missing","a":"thêm","lv":"xem","n":"Model Serving","id":"SK0212","why":"«Experience API-izing models».","s":1727,"e":1743}]},{"id":"87c4020ee3ccd595","src":"ITviec","t":"Product Manager (Data-Driven)","url":"https://itviec.com/it-jobs/product-manager-data-driven-annam-software-company-0823","x":"Product Manager (Data-Driven)\nWe are Annam Software – a 100 % foreign-owned product house building the next-generation Omnicasa property CRM for the European market. Our legacy web (Vue 2) and Windows desktop apps still serve 3000+ agents, but we’re rebuilding everything. To move fast and smart we need a Product Manager who lives inside PostHog, turns events into insights, and tells us exactly which features make the cut for MVP-1. If you love SQL, funnels, cohorts, and saying “let the data decide”, read on. Salary up to 100 million VND\nWhat you will own PostHog end-to-end: architect taxonomy, instrument events, set up feature flags, create dashboards, build cohorts, own data quality. Define North-Star metric and 3–5 key drivers for the new CRM; review weekly with execs. Run weekly growth experiments: hypothesis → PostHog A/B → readout → ship/roll-back. Lead migration roadmap: audit legacy apps, map user flows, prioritise must-have vs nice-to-have features for the new front-end Write concise PRDs with clear success metrics (measurable in PostHog). Collaborate with different teams (FE, BE, QA, Design, Customer Success) in Linear + Confluence; run sprints, groom backlogs, cut scope ruthlessly. Talk to EU agents, summarise pain points, feed into backlog. Present data-backed recommendations to stakeholders. What you must bring 4 + years as a SaaS product manager or growth PM; B2B CRM / Prop-Tech experience is a big plus. Expert-level PostHog skills: events, autocapture, feature flags, SQL insights, cohorts, experiments. Proven record of moving legacy products to modern stacks while protecting revenue. Experience writing perfect and understandable documentation for your product Comfortable writing basic SQL and reading JSON API payloads. Agile native: user stories, story mapping, OKRs, Scrum/Kanban. Excellent English (speak & write); Nice to have Experience with Tauri / Electron desktop migration. Working knowledge of Node, REST & GraphQL to mock quick fixes. UX eye – can whip up a quick Figma wireframe when designers are busy.","sp":"holdout","kp":false,"note":"CRM chỉ giới thiệu sản phẩm công ty; đã loại khỏi gold.","L":[{"n":"SQL","id":"SK0278","s":448,"e":451},{"n":"Dashboarding","id":"SK0076","s":649,"e":659},{"n":"Data Quality","id":"SK0094","s":680,"e":692},{"n":"A/B Testing","id":"SK0001","s":834,"e":837},{"n":"Cohort Analysis","id":"SK0065","s":462,"e":469},{"n":"Funnel Analysis","id":"SK0144","s":453,"e":460},{"n":"Confluence","id":"SK0067","s":1148,"e":1158},{"n":"JSON","id":"SK0167","s":1744,"e":1748}],"S":[]},{"id":"d43d1ecb22e88b90","src":"ITviec","t":"AI Cloud FullStack Developer (Java/ Node/ AWS/Angular)","url":"https://itviec.com/it-jobs/ai-cloud-fullstack-developer-java-node-aws-angular-hitachi-digital-services-4844","x":"AI Cloud FullStack Developer (Java/ Node/ AWS/Angular)\nWe are seeking an AI-Driven Full Stack Developer with 2 + years of experience in full-stack application development, strong expertise in Java, Node.js, AWS, and Angular , and hands-on experience leveraging AI-powered development tools and AI-enabled solutions.\nKey Skills & Qualifications Strong verbal and written communication skills in English . Hands-on experience with AI-driven software development , utilizing tools such as GitHub Copilot, Cursor, Claude, ChatGPT, or similar AI assistants to accelerate coding, testing, debugging, refactoring, and documentation. Experience building AI-enabled applications or integrating LLM/Generative AI services (OpenAI, Azure OpenAI, Amazon Bedrock, Anthropic Claude, etc.). Strong proficiency in Java and Node.js for backend application development. Hands-on experience with AWS cloud services , including ECS, Lambda, S3, DynamoDB, API Gateway, AppSync, GraphQL, CloudWatch, and related technologies. Frontend development experience with Angular (preferred), React , or Vue.js. Solid understanding of RESTful APIs , GraphQL, and microservices architecture . Experience with modern software engineering practices, including CI/CD pipelines , automated testing, and Git-based version control. Familiarity with Infrastructure as Code (IaC) and cloud-native development practices is a plus. Experience working in Agile/Scrum environments. Proficient in using JIRA for sprint planning, issue tracking, and project management. Experience maintaining technical documentation and project knowledge in Confluence . Strong analytical, problem-solving, collaboration, and stakeholder communication skills. Preferred Qualifications AWS certifications (Developer Associate, Solutions Architect Associate, or equivalent). Experience with containerization technologies such as Docker and Kubernetes . Experience implementing AI-assisted SDLC practices to improve team productivity and software quality. Knowledge of prompt engineering, RAG (Retrieval-Augmented Generation), AI agents, or agentic workflows is an advantage.","sp":"tune","kp":false,"note":"Chờ người rà soát đầy đủ cả nhãn đã gán và kỹ năng có thể bị bỏ sót.","L":[{"n":"Cloud Computing","id":"SK0062","s":3,"e":8},{"n":"Java","id":"SK0168","s":30,"e":34},{"n":"Amazon Web Services","id":"SK0018","s":42,"e":45},{"n":"Claude","id":"SK0059","s":510,"e":516},{"n":"ChatGPT","id":"SK0056","s":518,"e":525},{"n":"Debugging","id":"SK0110","s":583,"e":592},{"n":"Large Language Models","id":"SK0179","s":685,"e":688},{"n":"Generative AI","id":"SK0146","s":689,"e":702},{"n":"OpenAI API","id":"SK0231","s":713,"e":719},{"n":"Microsoft Azure","id":"SK0201","s":721,"e":726},{"n":"Amazon Bedrock","id":"SK001
